/* Layout: landscape tablet on a paper stage. Inside, the Figma 1440×1024 frame is laid out at true size and centred;
   one element (#wl) carries the idle → hover → open smart-animate states. Phones: no frame, canvas scales to fit. */
:root{
  color-scheme:light;
  --font:"Jost",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --page:#F9F9F9;
  --spring:cubic-bezier(.65,0,.15,1); --soft:cubic-bezier(.22,1,.36,1); --out:cubic-bezier(.23,1,.32,1); --pop:cubic-bezier(.34,1.35,.5,1);
  --card-shadow:0 140px 39px 0 rgba(0,0,0,0),0 89px 36px 0 rgba(0,0,0,.02),0 50px 30px 0 rgba(0,0,0,.08),0 22px 22px 0 rgba(0,0,0,.13),0 6px 12px 0 rgba(0,0,0,.15);
  --k:1;
}
html,body{height:100%}
body{margin:0;overflow:hidden;font-family:var(--font);-webkit-font-smoothing:antialiased;color:#000;
  background:radial-gradient(55% 45% at 50% 44%,#FFFFFF 0%,#F6F5F2 55%,#ECEAE5 100%);
  display:grid;place-items:center;box-sizing:border-box;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
body.recmode{width:1920px;height:1080px;padding:0}
#wbox{position:relative}
.win{position:absolute;left:0;top:0;width:1204px;height:804px;border-radius:44px;transform-origin:0 0;
  background:linear-gradient(150deg,#3A3A3E 0%,#1C1C1F 35%,#0D0D0F 100%);
  box-shadow:inset 0 0 0 1.5px #55555A,inset 0 0 0 3px #161618,0 50px 90px -40px rgba(40,30,15,.45),0 20px 40px -26px rgba(40,30,15,.35)}
.win .btn-top{position:absolute;top:-3px;height:4px;border-radius:2px 2px 0 0;background:linear-gradient(#4A4A4F,#2A2A2D)}
.cam{position:absolute;top:7px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:#1A1A1C;box-shadow:inset 0 0 0 1.5px #2A2A30}
.viewport{position:absolute;inset:16px;border-radius:28px;overflow:hidden;background:var(--page);box-shadow:0 0 0 1px #000;isolation:isolate}
/* the Figma frame at true size, centred */
.canvas{position:absolute;left:50%;top:50%;width:1440px;height:1024px;margin:-530px 0 0 -720px;transform:scale(var(--k));transform-origin:720px 530px}

/* photo stack: frame 1:7331 at (427,292) 585.9×315.9 */
.stack{position:absolute;left:427px;top:292px;width:585.9px;height:315.9px}
.slot{position:absolute;width:250px;height:250px;transition:transform .8s var(--soft),filter .6s var(--out),opacity .6s}
.slot .bob{position:absolute;inset:0;animation:bob 5.4s ease-in-out infinite}
.slot .card{position:absolute;inset:0;box-sizing:border-box;border:5px solid #fff;border-radius:32px;overflow:hidden;box-shadow:var(--card-shadow);background:#ddd;cursor:pointer;transition:box-shadow .4s}
.slot .card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:27px;pointer-events:none;user-select:none;-webkit-user-drag:none}
.slot.l{left:28.09px;top:37.09px;--r:-15deg;transform:rotate(var(--r));z-index:1}
.slot.m{left:155px;top:0;--r:0deg;z-index:2}
.slot.r{left:307.81px;top:37.81px;--r:15deg;transform:rotate(var(--r));z-index:3}
.slot.l .bob{animation-delay:-1.6s;animation-duration:6s}.slot.r .bob{animation-delay:-3.1s;animation-duration:6.6s}
@keyframes bob{50%{transform:translateY(-6px)}}
.stack.has .slot:not(.up){filter:saturate(.85) brightness(.97)}
.slot.up{z-index:9;transform:translateY(-18px) rotate(calc(var(--r) * .45)) scale(1.07)}
.slot.up .card{box-shadow:0 60px 60px -30px rgba(0,0,0,.35),0 24px 24px -8px rgba(0,0,0,.18),0 6px 12px rgba(0,0,0,.15)}
.stack.has .slot.l:not(.up){transform:translateX(-14px) rotate(-17deg)}
.stack.has .slot.r:not(.up){transform:translateX(14px) rotate(17deg)}
.stack.has .slot.m:not(.up){transform:translateY(6px) scale(.98)}

.head{position:absolute;left:0;right:0;top:648px;margin:0;text-align:center;font:500 20px/24px var(--font);color:#000}

/* scrim (frame 1:7336 / 1:7313) */
.scrim{position:absolute;left:-152px;top:-63px;width:1744px;height:1151px;background:rgba(0,0,0,.24);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  opacity:0;pointer-events:none;transition:opacity .9s var(--soft);z-index:10}
.open .scrim{opacity:1;pointer-events:auto}

/* ---------- the morphing waitlist element (1:7337 → 1:7291 → 1:7314) ---------- */
#wl{position:absolute;z-index:11;left:495px;top:722px;width:450px;height:45px;box-sizing:border-box;border:1px solid #fff;border-radius:40px;overflow:hidden;
  background:rgba(170,170,170,.1);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  box-shadow:0 68px 41px 0 rgba(217,217,217,.15),0 30px 30px 0 rgba(217,217,217,.26),0 8px 17px 0 rgba(217,217,217,.29);cursor:pointer;
  transition:top 1s var(--spring),height 1s var(--spring),border-radius 1s var(--spring),background-color .8s var(--soft),box-shadow .8s var(--soft),-webkit-backdrop-filter .8s,backdrop-filter .8s}
#wl *{box-sizing:border-box}
#wl .el{position:absolute;margin:-1px 0 0 -1px;transition:left 1s var(--spring),top 1s var(--spring),width 1s var(--spring),height 1s var(--spring),opacity .7s var(--soft),color .6s var(--soft),font-size .8s var(--spring),background-color .6s,border-color .6s}
.ttl{left:24px;top:11px;display:flex;align-items:center;height:20px;white-space:nowrap;font:400 14px/20px var(--font);color:#7D7D7D}
.cls{left:320px;top:-249px;width:109px;height:33px;border:0;border-radius:500px;background:#A4A4A4;color:#FAFAFA;font:400 12px var(--font);cursor:pointer;padding:0}
.cls:hover{background:rgba(255,255,255,.35)!important}
.dsc{left:19px;top:555px;width:318px;margin:0;font:400 16px/23px var(--font);color:#fff;opacity:0}
.open .dsc,.done .dsc{opacity:.5}
.fld{opacity:0}.open .fld{opacity:1}
.fld{left:19px;width:410px;height:45px;border:1px solid #fff;border-radius:14px}
.fld input{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent;padding:0 16px;font:400 12px var(--font);color:#fff;outline:none;border-radius:14px;transition:background .2s}
.fld input::placeholder{color:#7D7D7D;transition:color .4s}
.f1{top:1201px}.f2{top:1846px}.f3{top:2491px}
.btn{left:315px;top:3px;width:130px;height:37px;padding:0;border:0;background:none;cursor:pointer}
.btn .rim{position:absolute;inset:0;border-radius:500px;border:.7px solid #7F7E7C;background:linear-gradient(#FDFDFD,#555 50%,#F6F5F3)}
.btn .face{position:absolute;inset:2px;border-radius:500px;border:.35px solid #BABABA;overflow:hidden;
  filter:drop-shadow(0 .7px .7px rgba(0,0,0,.1)) drop-shadow(.7px 2.1px 1px rgba(0,0,0,.09)) drop-shadow(.7px 4.9px 1.4px rgba(0,0,0,.05))}
.btn .dark,.btn .lite{position:absolute;inset:0;border-radius:500px;transition:opacity .7s var(--soft)}
.btn .dark{background:linear-gradient(#8F8F8F,#B1B1B1)}
.btn .lite{background:linear-gradient(#CCC,#D7D7D7);opacity:0}
.btn .t{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;transition:opacity .55s var(--soft),transform .7s var(--soft),filter .55s}
.btn .t1{font:400 14px var(--font);color:#FAFAFA}
.btn .t2{font:400 12px var(--font);color:#000;opacity:0;transform:translateY(8px);filter:blur(2px)}
.btn:active .face{filter:brightness(.97)}

/* hover state (Desktop - 18) */
.hov #wl{top:725px;height:59px;border-radius:32px}
.hov .ttl{left:21px;top:17.5px;height:23px;font-size:16px;line-height:23px;font-weight:600;color:#2A3E19}
.hov .cls{top:-69px;background:rgba(255,255,255,.25)}
.hov .dsc{top:435px}
.hov .f1{top:860px}.hov .f2{top:1284px}.hov .f3{top:1708px}
.hov .fld{border-color:rgba(255,255,255,.3)}
.hov .fld input::placeholder{color:#fff}
.hov .btn{left:310px;top:8.5px;height:40px}
/* open state (Desktop - 20) */
.open #wl{top:300px;height:425px;border-radius:32px;background-color:rgba(112,112,112,.25);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  box-shadow:0 190px 53px 0 rgba(217,217,217,.01);cursor:default}
.open .ttl{left:22px;top:26px;height:23px;font-size:16px;line-height:23px;font-weight:600;color:#fff}
.open .cls{top:21px;background:rgba(255,255,255,.25)}
.open .dsc{top:75px}
.open .f1{top:150px}.open .f2{top:219px}.open .f3{top:288px}
.open .fld{border-color:rgba(255,255,255,.3)}
.open .fld input::placeholder{color:#fff}
.open .btn{left:19px;top:354px;width:410px;height:40px}
.hov .btn .dark,.open .btn .dark,.done .btn .dark{opacity:0}
.hov .btn .lite,.open .btn .lite,.done .btn .lite{opacity:1}
.hov .btn .t1,.open .btn .t1,.done .btn .t1{opacity:0;transform:translateY(-8px);filter:blur(2px)}
.hov .btn .t2,.open .btn .t2,.done .btn .t2{opacity:1;transform:none;filter:none}
/* stagger: things arrive one by one when opening */
.open .dsc{transition-delay:.14s}
.open .f1{transition-delay:.24s}.open .f2{transition-delay:.34s}.open .f3{transition-delay:.44s}
.open .btn{transition-delay:.06s}.open .cls{transition-delay:.1s}
.fld:focus-within{border-color:rgba(255,255,255,.75)!important;box-shadow:0 0 0 3px rgba(255,255,255,.12)}
.fld:focus-within input{background:rgba(255,255,255,.06)}
.fld.err{border-color:#FFB4A8!important;box-shadow:0 0 0 3px rgba(255,120,100,.2)}
.fld.ok::after{content:"";position:absolute;right:16px;top:50%;margin-top:-5px;width:9px;height:5px;border-left:1.6px solid #B6F5CB;border-bottom:1.6px solid #B6F5CB;transform:rotate(-45deg)}
.spin{width:12px;height:12px;border-radius:50%;border:1.6px solid rgba(0,0,0,.18);border-top-color:#111;animation:sp .6s linear infinite}
@keyframes sp{to{transform:rotate(1turn)}}
/* done state: fields slide back out, the card settles shorter */
.done .scrim{opacity:1;pointer-events:auto}
.done #wl{top:404px;height:216px;border-radius:32px;background-color:rgba(112,112,112,.25);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 190px 53px 0 rgba(217,217,217,.01);cursor:default}
.done .ttl{left:22px;top:26px;height:23px;font-size:16px;line-height:23px;font-weight:600;color:#fff}
.done .cls{top:21px;background:rgba(255,255,255,.25)}
.done .dsc{top:75px}
.done .f1{top:430px}.done .f2{top:500px}.done .f3{top:570px}
.done .fld{border-color:rgba(255,255,255,.3);opacity:0}
.done .btn{left:19px;top:150px;width:410px;height:40px}
.done .f1,.done .f2,.done .f3{transition-delay:0s}
.tick{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#2BB673;margin-left:8px;flex:none;transform:scale(0);transition:transform .6s var(--pop) .45s}
.tick svg{width:10px;height:8px}
.done .tick{transform:scale(1)}
.joined #wl .ttl{color:#2A3E19;font-weight:600}
.joined .btn .dark{opacity:0}.joined .btn .lite{opacity:1;background:linear-gradient(#EAF8EF,#C9EBD5)}
.joined .btn .t1{opacity:0}.joined .btn .t2{opacity:1;transform:none;filter:none}
.joined #wl{cursor:default}
:focus-visible{outline:2px solid #7D7D7D;outline-offset:3px}

.ctrl{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:6px;padding:6px;border-radius:999px;background:rgba(255,255,255,.85);border:1px solid rgba(0,0,0,.07);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);z-index:30}
.ctrl button{white-space:nowrap;font:500 13px var(--font);background:transparent;color:#1C1C1F;border:0;border-radius:999px;padding:8px 13px;cursor:pointer}
.ctrl button:hover{background:rgba(0,0,0,.05)}
.ctrl .play{background:#1C1C1F;color:#fff}
body.clean .ctrl,body.recmode .ctrl{display:none}
#cur{position:absolute;left:0;top:0;z-index:40;pointer-events:none;opacity:0;transition:opacity .3s}
#cur.on{opacity:1}
#cur svg{transition:transform .14s var(--out);transform-origin:3px 3px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3))}
#cur.down svg{transform:scale(.85)}

@media (max-width:760px){
  body{padding:0;display:block}
  #wbox{width:100%!important;height:100%!important}
  .win{position:absolute;inset:0;width:auto;height:auto;border-radius:0;transform:none!important;box-shadow:none;background:var(--page)}
  .win .btn-top,.cam{display:none}.viewport{inset:0;border-radius:0;box-shadow:none}
  .ctrl{top:calc(10px + env(safe-area-inset-top,0px));bottom:auto;left:auto;right:12px;transform:none;padding:4px}
  .ctrl button{padding:6px 10px;font-size:12px}.ctrl #hide{display:none}
  .fld input{font-size:16px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;transition-delay:0s!important}}
</style>
</head>
<body>
<div id="wbox"><div class="win" id="win"><i class="btn-top" style="left:880px;width:46px"></i><i class="btn-top" style="left:940px;width:46px"></i><i class="btn-top" style="left:120px;width:60px"></i><span class="cam"></span>
  <div class="viewport" id="vp">
    <div class="canvas" id="cv">
      <div class="stack" id="stack" role="group" aria-label="Travel photos"><div class="slot l"><div class="bob"><div class="card" tabindex="0" aria-label="Coastal castle ruins in the snow"><img src="card-l.webp" alt="" width="240" height="240"></div></div></div><div class="slot m"><div class="bob"><div class="card" tabindex="0" aria-label="Milky Way over a mountain lake"><img src="card-m.webp" alt="" width="240" height="240"></div></div></div><div class="slot r"><div class="bob"><div class="card" tabindex="0" aria-label="Rolling green hills in spring"><img src="card-r.webp" alt="" width="240" height="240"></div></div></div></div>
      <h1 class="head">Get Ready for a Travel Revolution<br>Adventure awaits, but spots are limited.</h1>
      <div class="scrim" id="scrim"></div>
      <div id="wl" role="button" tabindex="0" aria-label="Join our exclusive waitlist">
        <span class="el ttl" id="ttl">Join our exclusive waitlist today</span>
        <button class="el cls" id="cls" type="button" tabindex="-1">Close</button>
        <p class="el dsc" id="dsc">By joining, you'll receive updates about our launch and exclusive offers.</p>
        <label class="el fld f1" id="ff"><input id="first" placeholder="First name" autocomplete="given-name" tabindex="-1" aria-label="First name"></label>
        <label class="el fld f2" id="fl"><input id="last" placeholder="Last name" autocomplete="family-name" tabindex="-1" aria-label="Last name"></label>
        <label class="el fld f3" id="fe"><input id="email" type="email" placeholder="Email" autocomplete="email" tabindex="-1" aria-label="Email"></label>
        <button class="el btn" id="btn" type="button" tabindex="-1"><span class="rim"></span><span class="face"><span class="dark"></span><span class="lite"></span><span class="t t1">Join our waitlist</span><span class="t t2" id="t2">Submit</span></span></button>
      </div>
    </div>
    <div id="cur"><svg width="18" height="24" viewBox="0 0 18 24"><path d="M2 2v17l4.5-4.2 3 6.7 3.1-1.4-3-6.6H16z" fill="#111" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg></div>
  </div>
</div></div>
<div class="ctrl"><button type="button" class="play" id="play">▶ Play demo</button><button type="button" id="reset">Reset</button><button type="button" id="hide">Hide (H)</button></div>

<script>
const $=s=>document.querySelector(s);
const TS=(location.hash.match(/#record-([\d.]+)/)||[0,1])[1]*1;
const REC=location.hash.startsWith('#record');if(REC)document.body.classList.add('recmode');
const wait=ms=>new Promise(r=>setTimeout(r,ms/TS));
if(TS!==1){const slow=()=>{for(const a of document.getAnimations())if(a.playbackRate!==TS)a.playbackRate=TS;requestAnimationFrame(slow)};requestAnimationFrame(slow);}
const phone=()=>matchMedia('(max-width:760px)').matches;
const vp=$('#vp'),cv=$('#cv'),root=$('#vp');let S=1,K=1;
function fit(){if(phone()){S=1;K=Math.min(1,(innerWidth-12)/600);cv.style.setProperty('--k',K);return}
  K=1;cv.style.setProperty('--k',1);const W=REC?1920:innerWidth-32,H=REC?1080:innerHeight-32,res=REC?150:(document.body.classList.contains('clean')?20:90);
  S=Math.min(REC?1.18:1.1,(H-res)/804,(W-(REC?120:0))/1204);$('#wbox').style.width=1204*S+'px';$('#wbox').style.height=804*S+'px';$('#win').style.transform=`scale(${S})`}
addEventListener('resize',fit);
function loc(el){const r=el.getBoundingClientRect(),v=vp.getBoundingClientRect(),s=phone()?1:S;return{x:(r.left-v.left)/s,y:(r.top-v.top)/s,w:r.width/s,h:r.height/s}}


/* ---------- photo stack: hovered card pops above the others ---------- */
const stack=$('#stack'),slots=[...stack.querySelectorAll('.slot')];
function up(s){slots.forEach(x=>x.classList.toggle('up',x===s));stack.classList.toggle('has',!!s)}
slots.forEach(s=>{s.addEventListener('pointerenter',()=>{if(!demoing)up(s)});s.addEventListener('click',()=>up(s.classList.contains('up')?null:s))});
stack.addEventListener('pointerleave',()=>{if(!demoing)up(null)});

/* ---------- waitlist: idle → hover → open → done ---------- */
const wl=$('#wl');let state='idle',joinedName='';
function setState(s){state=s;['hov','open','done'].forEach(c=>cv.classList.remove(c));if(s==='hover')cv.classList.add('hov');if(s==='open')cv.classList.add('open');if(s==='done')cv.classList.add('done');
  const inF=s==='open';['first','last','email'].forEach(id=>$('#'+id).tabIndex=inF?0:-1);$('#btn').tabIndex=(s==='open'||s==='done')?0:-1;$('#cls').tabIndex=(s==='open'||s==='done')?0:-1;
  wl.setAttribute('role',s==='idle'||s==='hover'?'button':'dialog');wl.tabIndex=s==='idle'||s==='hover'?0:-1}
let closedAt=0;wl.addEventListener('pointerenter',()=>{if(!demoing&&state==='idle'&&performance.now()-closedAt>700)open()});
function open(){if(state==='open'||state==='done'||cv.classList.contains('joined'))return;up(null);setState('open');if(!demoing)setTimeout(()=>$('#first').focus({preventScroll:true}),900/TS)}
wl.addEventListener('click',e=>{if(state==='idle'||state==='hover')open()});
wl.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&(state==='idle'||state==='hover')){e.preventDefault();open()}});
function close(){if(state!=='open'&&state!=='done')return;closedAt=performance.now();document.activeElement&&document.activeElement.blur();const wasDone=state==='done';setState('idle');
  if(wasDone){cv.classList.add('joined');$('#ttl').innerHTML=`You're on the list, ${esc(joinedName)}<span class="tick"><svg viewBox="0 0 11 9"><path d="M1 4.5 4 7.5 10 1.5" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>`;
    $('#t2').textContent='Joined';setTimeout(()=>$('#ttl .tick')&&($('#ttl .tick').style.transform='scale(1)'),40)}}
$('#cls').addEventListener('click',e=>{e.stopPropagation();close()});$('#scrim').addEventListener('click',close);
addEventListener('keydown',e=>{if(e.key==='Escape')close();if(e.key.toLowerCase()==='h'&&!/INPUT/.test(e.target.tagName)){document.body.classList.toggle('clean');fit()}});
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* validation + submit */
const EM=/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
function val(id){const v=$('#'+id).value.trim(),ok=id==='email'?EM.test(v):v.length>0,f=$('#'+id).parentElement;f.classList.toggle('err',!ok);f.classList.toggle('ok',ok);return ok}
['first','last','email'].forEach(id=>$('#'+id).addEventListener('input',()=>{const f=$('#'+id).parentElement;if(f.classList.contains('err')||f.classList.contains('ok'))val(id)}));
['first','last','email'].forEach((id,i,a)=>$('#'+id).addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();i<2?$('#'+a[i+1]).focus():submit()}}));
let busy=false;
async function submit(){if(state==='done'){close();return}if(state!=='open'||busy)return;
  const ok=['first','last','email'].map(val).every(Boolean);
  if(!ok){const f=wl.querySelector('.fld.err');f.animate([{translate:'0 0'},{translate:'-6px 0'},{translate:'6px 0'},{translate:'0 0'}],{duration:300});f.querySelector('input').focus();return}
  busy=true;$('#t2').innerHTML='<span class="spin"></span>Joining';await wait(1500);
  joinedName=$('#first').value.trim();const email=$('#email').value.trim();
  $('#ttl').innerHTML=`You're on the list, ${esc(joinedName)}<span class="tick"><svg viewBox="0 0 11 9"><path d="M1 4.5 4 7.5 10 1.5" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>`;
  $('#dsc').textContent=`We'll email ${email} the moment spots open.`;$('#t2').textContent='Done';
  setState('done');busy=false}
$('#btn').addEventListener('click',e=>{e.stopPropagation();submit()});

/* ---------- scripted demo ---------- */
const cur=$('#cur');let cx=900,cy=620,demoing=false;
const ez=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
function tween(dur,fn){return new Promise(r=>{const t0=performance.now();const f=now=>{const k=Math.min(1,(now-t0)*TS/dur);fn(ez(k));k<1?requestAnimationFrame(f):r()};requestAnimationFrame(f)})}
const place=()=>cur.style.transform=`translate(${cx-3}px,${cy-3}px)`;
function moveTo(x,y,dur=650){const x0=cx,y0=cy;return tween(dur,k=>{cx=x0+(x-x0)*k;cy=y0+(y-y0)*k;place()})}
const mid=el=>{const r=loc(el);return[r.x+r.w/2,r.y+r.h/2]};
async function press(el,fn){await moveTo(...mid(el));cur.classList.add('down');await wait(130);cur.classList.remove('down');fn&&fn()}
async function type(id,t){const i=$('#'+id);i.focus({preventScroll:true});for(const ch of t){i.value+=ch;i.dispatchEvent(new Event('input'));await wait(55)}}
async function demo(){if(demoing)return;demoing=true;reset();cx=880;cy=640;place();await wait(300);cur.classList.add('on');await wait(400);
  for(const s of slots){const r=loc(s.querySelector('.card'));await moveTo(r.x+r.w*.5,r.y+r.h*.45,560);up(s);await wait(1000)}
  up(null);const w=loc(wl);await moveTo(w.x+w.w*.42,w.y+w.h*.5,700);open();await wait(1900);
  await press($('#ff'));await type('first','Hafsoh');await press($('#fl'));await type('last','Bashar');await press($('#fe'));await type('email','hafsoh@dhuni.design');await wait(250);
  await press($('#btn'),submit);await wait(3200);
  await press($('#btn'),close);await wait(1900);await moveTo(cx+160,cy+140,600);await wait(900);cur.classList.remove('on');await wait(700);demoing=false;window.__demoDone=true}
function reset(){busy=false;cv.classList.remove('joined');setState('idle');up(null);
  $('#ttl').textContent='Join our exclusive waitlist today';$('#dsc').textContent="By joining, you'll receive updates about our launch and exclusive offers.";$('#t2').textContent='Submit';
  ['first','last','email'].forEach(id=>{$('#'+id).value='';$('#'+id).parentElement.classList.remove('err','ok')})}
$('#play').onclick=demo;$('#reset').onclick=()=>{if(!demoing)reset()};$('#hide').onclick=()=>{document.body.classList.toggle('clean');fit()};
window.demo=demo;document.fonts.ready.then(fit);fit();
</script>
</body>
</html>
