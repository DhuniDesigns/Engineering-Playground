:root{color-scheme:light;--font:"Manrope",ui-sans-serif,system-ui,-apple-system,sans-serif;--blue:#415AFF;--ink:#171717;
  --out:cubic-bezier(.23,1,.32,1);--io:cubic-bezier(.65,0,.35,1)}
html,body{height:100%}
body{margin:0;overflow:hidden;font-family:var(--font);-webkit-font-smoothing:antialiased;color:var(--ink);
  background:radial-gradient(55% 45% at 50% 44%,#FFFFFF 0%,#F6F5F2 55%,#ECEAE5 100%);display:grid;place-items:center;box-sizing:border-box;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body.recmode{padding:0;width:1080px;height:1350px}
#pbox{position:relative}
.phone{position:absolute;left:0;top:0;width:410px;height:864px;border-radius:64px;transform-origin:0 0;
  background:linear-gradient(150deg,#3A3A3E 0%,#1C1C1F 35%,#0D0D0F 100%);
  box-shadow:inset 0 0 0 1.5px #55555A,inset 0 0 0 3px #161618,inset 0 0 0 7px #0A0A0B,0 50px 80px -34px rgba(30,25,15,.38),0 24px 40px -28px rgba(30,25,15,.3)}
.hw{position:absolute;width:4px;border-radius:2px 0 0 2px;background:linear-gradient(90deg,#2A2A2D,#4A4A4F 60%,#1D1D20);left:-3.5px}
.hw.p{left:auto;right:-3.5px;border-radius:0 2px 2px 0;background:linear-gradient(270deg,#2A2A2D,#4A4A4F 60%,#1D1D20)}
.hw.a{top:148px;height:30px}.hw.v1{top:206px;height:58px}.hw.v2{top:276px;height:58px}.hw.p{top:232px;height:92px}
.screen{position:absolute;inset:10px;border-radius:54px;overflow:hidden;background:#fff;isolation:isolate;box-shadow:0 0 0 1px #000;-webkit-user-select:none;user-select:none}
.sb{position:absolute;inset:0 0 auto;height:54px;display:flex;align-items:center;justify-content:space-between;padding:4px 30px 0 48px;z-index:60;font:700 16px var(--font);pointer-events:none;color:#111}
.island{position:absolute;top:12px;left:50%;width:122px;height:35px;margin-left:-61px;border-radius:20px;background:#0A0A0A}
.sbi{display:flex;gap:6px;align-items:center}
.home{position:absolute;bottom:8px;left:50%;width:132px;height:5px;margin-left:-66px;border-radius:3px;background:#111;z-index:60;pointer-events:none}

/* design canvas: Figma frame 375×812, scaled to the 390pt screen */
.app{position:absolute;left:0;top:0;width:375px;height:812px;transform:scale(1.04);transform-origin:0 0;
  background:linear-gradient(180deg,#EDEFFD 0%,#F1F2FD 16%,#F8F8FE 34%,#FFFFFF 52%)}
.ab{position:absolute}
.icbtn{left:20px;top:66px;width:36px;height:36px;border-radius:10px;background:#D7DCFF;display:grid;place-items:center;border:0;padding:0;cursor:pointer;transition:transform .16s var(--out)}
.icbtn:active{transform:scale(.94)}
.icbtn.r{left:auto;right:20px}
.cover{left:20px;top:126px;width:81px;height:80px;border-radius:17px;border:3px solid #fff;box-sizing:border-box;overflow:hidden;background:#fff;
  box-shadow:0 10px 18px -8px rgba(30,30,60,.22),0 2px 5px rgba(30,30,60,.08)}
.cover img{width:100%;height:100%;object-fit:cover;display:block;border-radius:13px}
.priv{left:112px;top:147px;height:23px;padding:0 10px 0 7px;border-radius:10px;background:#fff;display:flex;align-items:center;gap:5px;font:500 10px var(--font);color:#141414;
  box-shadow:0 1px 2px rgba(0,0,0,.04),0 4px 10px -4px rgba(30,30,60,.08)}
.priv img{width:15px;height:15px}
.stack{left:113px;top:175px;width:76px;height:32px}
.sally{left:194px;top:183.5px;font:400 11px/16px var(--font);color:#A8A8A8;letter-spacing:.005em}
.title{left:20px;top:231px;margin:0;font:600 21px/28px var(--font);letter-spacing:-.025em;color:#2E2E2E}
.desc{left:20px;top:265px;width:335px;margin:0;font:400 12.4px/18px var(--font);color:#B4B4B4;letter-spacing:.002em}

/* --- the CTA that morphs Join → member pill --- */
#cta{left:20px;top:332px;width:120px;height:40px;border-radius:12px;cursor:pointer;outline:none;
  -webkit-tap-highlight-color:transparent}
#cta .glow{position:absolute;inset:-4px;border-radius:17px;background:rgba(65,90,255,.10);opacity:0}
#cta .base{position:absolute;inset:0;border-radius:inherit;background:#fff;border:1.5px solid var(--blue);box-sizing:border-box;opacity:0}
#cta .fill{position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,#577DFC 0%,#456CF7 45%,#3A5DF4 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28),inset 0 0 0 1px rgba(28,58,230,.6),0 8px 16px -8px rgba(55,85,245,.7),0 2px 4px rgba(55,85,245,.25)}
#cta .beam{position:absolute;inset:0;border-radius:inherit;padding:1.5px;opacity:0;pointer-events:none;
  background:conic-gradient(from var(--a),transparent 0deg,transparent 280deg,rgba(150,170,255,.0) 290deg,#9DB0FF 330deg,#fff 350deg,transparent 360deg);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
@property --a{syntax:"<angle>";inherits:false;initial-value:0deg}
#cta .join{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:10px;color:#fff;font:500 14px var(--font);letter-spacing:.005em}
#cta .join svg{width:13px;height:13px}
#cta .mem{position:absolute;left:12px;top:0;height:42px;display:flex;align-items:center;gap:9px;white-space:nowrap;font:600 12px var(--font);color:#232323;letter-spacing:-.005em;perspective:300px;pointer-events:none}
#cta .mem .emo{width:17px;height:17px;opacity:0}
#cta .mem .ch{display:inline-block;opacity:0;white-space:pre}
#cta .enter{position:absolute;right:2.5px;top:2.5px;width:86px;height:37px;border-radius:12px;border:0;background:#F8F8F8;color:#A7A7A7;font:500 12px var(--font);opacity:0;
  box-shadow:inset 0 0 0 1px #F0F0F0;cursor:pointer;pointer-events:none}
#cta.member .enter{pointer-events:auto}
#cta.member{cursor:default}
#cta:focus-visible .fill{outline:2px solid #1B2C9E;outline-offset:3px}

/* stats */
.stats{left:20px;top:391px;width:343px;height:88px;border-radius:22px;background:#F2F2F2;padding:4px;box-sizing:border-box}
.stats .in{position:relative;height:100%;border-radius:18px;background:#fff;display:grid;grid-template-columns:1fr 1fr;box-shadow:0 1px 2px rgba(0,0,0,.05),0 6px 14px -8px rgba(0,0,0,.12)}
.stats .in::after{content:"";position:absolute;left:50%;top:10px;bottom:10px;width:1px;background:#EFEFEF}
.stat{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;padding-top:2px}
.stat b{font:500 16px var(--font);letter-spacing:-.01em;color:#141414;font-variant-numeric:tabular-nums}
.stat span{display:flex;align-items:center;gap:6px;font:400 11px var(--font);color:#8E8E8E}
.stat img{width:16px;height:16px}

/* tabs + list */
.tabs{left:0;top:500px;width:375px;height:27px;border-bottom:1px solid #F3F3F3}
.tab{position:absolute;top:0;font:400 12.5px var(--font);color:#B9B9B9;transform:translateX(-50%)}
.tab.on{color:var(--blue)}
.uline{position:absolute;left:20px;top:24px;width:171.5px;height:1.5px;background:var(--blue);border-radius:1px}
.row{left:20px;width:343px;height:88px;border-bottom:1px solid #F4F4F4;box-sizing:border-box}
.row .av{position:absolute;left:0;top:13px;width:64px;height:61px}
.row .nm{position:absolute;left:71px;top:31px;font:500 15px/24px var(--font);letter-spacing:-.015em;color:#171717}
.row .role{position:absolute;right:0;top:30px;height:24px;padding:0 9px;border-radius:8px;background:#F8F8F8;box-shadow:inset 0 0 0 1px #EDEDED;display:flex;align-items:center;font:400 10px var(--font);color:#9C9C9C}

/* locked region + floater */
.veil{left:0;top:619px;width:375px;height:193px;background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,.7) 60%,#fff);
  -webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);pointer-events:none}
#float{left:11px;top:665px;width:353px;height:123px;z-index:5}
#float .card{position:absolute;inset:0;border-radius:26px;background:#fff;border:1.5px solid var(--blue);box-sizing:border-box;overflow:hidden;
  box-shadow:0 0 0 4px rgba(65,90,255,.10),0 18px 34px -16px rgba(40,60,200,.35)}
#float .msg{position:absolute;left:0;right:0;top:50px;text-align:center;font:400 14px/18px var(--font);color:#1F1F1F;letter-spacing:-.01em}
#float .fa{position:absolute;width:42px;height:43px;filter:drop-shadow(0 4px 6px rgba(40,30,80,.12))}
#float .fa img{width:100%;height:100%;display:block}
.bob{animation:bob 3.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px) rotate(var(--rr,3deg))}}
.fx{position:absolute;pointer-events:none;z-index:20}
.shard{position:absolute;border-radius:4px}
#touch{position:absolute;left:0;top:0;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:rgba(20,20,40,.18);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.7),0 4px 12px rgba(0,0,0,.12);
  z-index:70;pointer-events:none;opacity:0;transform:scale(.6)}

.ctrl{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:6px;padding:6px;border-radius:999px;background:rgba(255,255,255,.85);border:1px solid rgba(0,0,0,.07);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);z-index:30}
.ctrl button{white-space:nowrap;font:600 13px var(--font);background:transparent;color:#1C1C1F;border:0;border-radius:999px;padding:8px 13px;cursor:pointer}
.ctrl button:hover{background:rgba(0,0,0,.05)}
.ctrl .play{background:#1C1C1F;color:#fff}
body.clean .ctrl,body.recmode .ctrl{display:none}
@media (max-width:500px){
  body{padding:0;display:block}#pbox{width:100%!important;height:100%!important}
  .phone{position:absolute;inset:0;width:auto;height:auto;border-radius:0;transform:none!important;box-shadow:none;background:#fff}
  .hw,.sb,.home{display:none}.screen{inset:0;border-radius:0;box-shadow:none}
  .app{transform:scale(var(--k,1));top:var(--ty,0px)}
  .ctrl{top:calc(10px + env(safe-area-inset-top,0px));bottom:auto;left:auto;right:12px;transform:none;padding:4px}.ctrl button{padding:6px 10px;font-size:12px}.ctrl #hide{display:none}
}
@media (prefers-reduced-motion:reduce){.bob{animation:none}}
</style>

<script>
const $=s=>document.querySelector(s);
const TS=(location.hash.match(/#record-([\d.]+)/)||[0,1])[1]*1;
const REC=location.hash.startsWith('#record');if(REC)document.body.classList.add('recmode');
const wait=ms=>new Promise(r=>setTimeout(r,ms/TS));
if(TS!==1){const slow=()=>{for(const a of document.getAnimations())if(a.playbackRate!==TS)a.playbackRate=TS;requestAnimationFrame(slow)};requestAnimationFrame(slow)}
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
/* spring → CSS linear() easing */
function spring(stiff=170,damp=18,mass=1){let x=0,v=0,pts=[],t=0,dt=1/600;const N=600*2;
  for(let i=0;i<N;i++){const f=-stiff*(x-1)-damp*v;v+=f/mass*dt;x+=v*dt;t+=dt;if(i%10===0)pts.push(x);if(i>120&&Math.abs(x-1)<.0005&&Math.abs(v)<.005)break}
  pts.push(1);return{e:`linear(0,${pts.map(p=>p.toFixed(4)).join(',')})`,d:Math.round(pts.length*10/600*1000)}}
const SP=spring(210,22),SOFT=spring(140,20),BOUN=spring(260,14),SNAP=spring(380,28);
const OUT='cubic-bezier(.23,1,.32,1)';
const an=(el,kf,o)=>el.animate(kf,Object.assign({fill:'both'},o));

/* fit phone */
let S=1;const phoneW=()=>matchMedia('(max-width:500px)').matches;
function fit(){if(phoneW()){const k=innerWidth/375;$('#app').style.setProperty('--k',k);$('#app').style.setProperty('--ty',Math.max(0,(innerHeight-812*k)/2)+'px');return}
  const W=REC?1080:innerWidth,H=REC?1350:innerHeight,res=REC?150:(document.body.classList.contains('clean')?40:120);
  S=Math.min(REC?1.45:1.35,(H-res)/864,(W-40)/410);$('#pbox').style.width=410*S+'px';$('#pbox').style.height=864*S+'px';$('#phone').style.transform=`scale(${S})`}
addEventListener('resize',fit);

/* member label → chars */
const MSG='You’re now a member!';
$('#memT').innerHTML=[...MSG].map(c=>`<span class="ch">${c}</span>`).join('');
const chars=[...document.querySelectorAll('#memT .ch')];

const cta=$('#cta'),app=$('#app');let joined=false,busy=false;
function confetti(cx,cy){const C=['#415AFF','#FFC83D','#FF6FA8','#3DD68C','#8FA2FF','#FF8A3D'];
  for(let i=0;i<26;i++){const p=document.createElement('i');p.className='fx shard';const w=4+Math.random()*4,h=Math.random()<.5?w:w*2.2;
    Object.assign(p.style,{left:cx+'px',top:cy+'px',width:w+'px',height:h+'px',background:C[i%C.length],borderRadius:Math.random()<.4?'50%':'1.5px'});app.appendChild(p);
    const a=-Math.PI/2+(Math.random()-.5)*Math.PI*1.25,s=60+Math.random()*90,dx=Math.cos(a)*s,dy=Math.sin(a)*s,r=(Math.random()-.5)*720,d=900+Math.random()*500;
    an(p,[{transform:'translate(-50%,-50%) scale(.4)',opacity:1},{transform:`translate(calc(-50% + ${dx*.75}px),calc(-50% + ${dy*.75}px)) rotate(${r*.6}deg) scale(1)`,opacity:1,offset:.45},
      {transform:`translate(calc(-50% + ${dx}px),calc(-50% + ${dy+70}px)) rotate(${r}deg) scale(.8)`,opacity:0}],{duration:d,easing:'cubic-bezier(.2,.7,.3,1)'}).finished.then(()=>p.remove())}}

async function join(){if(joined||busy)return;busy=true;joined=true;
  const fill=cta.querySelector('.fill'),base=cta.querySelector('.base'),glow=cta.querySelector('.glow'),beam=cta.querySelector('.beam');
  /* press */
  await an(cta,[{transform:'scale(1)'},{transform:'scale(.95)'}],{duration:110,easing:OUT}).finished;
  an(cta,[{transform:'scale(.95)'},{transform:'scale(1)'}],{duration:BOUN.d,easing:BOUN.e});
  confetti(80,352);
  /* morph */
  an(cta,[{width:'120px',height:'40px',borderRadius:'12px'},{width:'343px',height:'42px',borderRadius:'14px'}],{duration:SP.d,easing:SP.e});
  an(fill,[{opacity:1},{opacity:0}],{duration:380,delay:60,easing:OUT});
  an(base,[{opacity:0},{opacity:1}],{duration:300,delay:40,easing:OUT});
  an(glow,[{opacity:0,transform:'scale(.96)'},{opacity:1,transform:'scale(1)'}],{duration:500,delay:200,easing:OUT});
  an($('#joinL'),[{opacity:1,filter:'blur(0)',transform:'translateY(0) scale(1)'},{opacity:0,filter:'blur(4px)',transform:'translateY(-8px) scale(.9)'}],{duration:200,easing:OUT});
  an($('#emo'),[{opacity:0,transform:'scale(0) rotate(-35deg)'},{opacity:1,transform:'scale(1) rotate(0)'}],{duration:BOUN.d,delay:180,easing:BOUN.e});
  chars.forEach((c,i)=>an(c,[{opacity:0,transform:'translateY(6px) rotateX(-35deg)',filter:'blur(2px)'},{opacity:1,transform:'none',filter:'blur(0)'}],{duration:SNAP.d,delay:230+i*22,easing:SNAP.e}));
  an($('#enter'),[{opacity:0,transform:'translateX(18px) scale(.9)',filter:'blur(3px)'},{opacity:1,transform:'none',filter:'blur(0)'}],{duration:SP.d,delay:420,easing:SP.e});
  /* border beam sweeps once around the new pill */
  setTimeout(()=>{an(beam,[{opacity:0,'--a':'0deg'},{opacity:1,'--a':'120deg',offset:.2},{opacity:1,'--a':'300deg',offset:.8},{opacity:0,'--a':'360deg'}],{duration:1300,easing:'cubic-bezier(.45,0,.25,1)',fill:'none'})},(820)/TS);
  cta.classList.add('member');cta.setAttribute('aria-label','You’re now a member');$('#enter').tabIndex=0;
  await wait(380);await pop();busy=false}

async function pop(){const f=$('#float'),card=$('#fcard'),fas=[...card.querySelectorAll('.fa')];
  /* inflate like a balloon: stretch, wobble, hold breath */
  await an(f,[{transform:'scale(1,1)'},{transform:'scale(1.04,.97)',offset:.25},{transform:'scale(.98,1.05)',offset:.5},{transform:'scale(1.07,1.06)',offset:.82},{transform:'scale(1.09,1.08)'}],
    {duration:520,easing:'cubic-bezier(.4,0,.6,1)'}).finished;
  /* pop */
  const R=f.getBoundingClientRect(),A=app.getBoundingClientRect(),k=A.width/375,ox=(R.left-A.left)/k,oy=(R.top-A.top)/k,w=R.width/k,h=R.height/k,cx=ox+w/2,cy=oy+h/2;
  // shockwave ring
  const ring=document.createElement('i');ring.className='fx';Object.assign(ring.style,{left:ox+'px',top:oy+'px',width:w+'px',height:h+'px',borderRadius:'28px',border:'2px solid rgba(65,90,255,.55)',boxSizing:'border-box'});app.appendChild(ring);
  an(ring,[{transform:'scale(1)',opacity:1},{transform:'scale(1.22)',opacity:0}],{duration:520,easing:OUT}).finished.then(()=>ring.remove());
  // rubber shards from the edge
  for(let i=0;i<22;i++){const t=i/22*Math.PI*2+Math.random()*.2,ex=cx+Math.cos(t)*w*.5,ey=cy+Math.sin(t)*h*.5;const s=document.createElement('i');s.className='fx shard';
    const big=Math.random()<.5,sw=big?14:8,sh=big?6:4;Object.assign(s.style,{left:ex+'px',top:ey+'px',width:sw+'px',height:sh+'px',background:i%3?'#fff':'#415AFF',boxShadow:i%3?'0 0 0 1.2px #415AFF':'none',borderRadius:'3px'});app.appendChild(s);
    const d=40+Math.random()*60,dx=Math.cos(t)*d,dy=Math.sin(t)*d*.8,r=(Math.random()-.5)*540;
    an(s,[{transform:`translate(-50%,-50%) rotate(${t}rad) scale(1)`,opacity:1},{transform:`translate(calc(-50% + ${dx}px),calc(-50% + ${dy+30}px)) rotate(${r}deg) scale(.4)`,opacity:0}],{duration:520+Math.random()*260,easing:'cubic-bezier(.15,.8,.3,1)'}).finished.then(()=>s.remove())}
  // avatars fly out
  fas.forEach(fa=>{const r=fa.getBoundingClientRect(),x=(r.left-A.left)/k,y=(r.top-A.top)/k,c=fa.cloneNode(true);c.classList.add('fx');Object.assign(c.style,{left:x+'px',top:y+'px'});app.appendChild(c);
    const vx=(x+21-cx),vy=(y+21-cy),m=Math.hypot(vx,vy)||1,d=50+Math.random()*30;
    an(c,[{transform:'scale(1.09) rotate(0)',opacity:1},{transform:`translate(${vx/m*d}px,${vy/m*d-20}px) scale(.55) rotate(${(vx>0?1:-1)*(20+Math.random()*30)}deg)`,opacity:0}],{duration:620,easing:'cubic-bezier(.2,.8,.3,1)'}).finished.then(()=>c.remove())});
  an(f,[{transform:'scale(1.09,1.08)',opacity:1},{transform:'scale(1.2,1.18)',opacity:0}],{duration:90,easing:'ease-out'});
  /* reveal the rest of the members */
  an($('#veil'),[{opacity:1},{opacity:0}],{duration:520,delay:60,easing:OUT});
  document.querySelectorAll('.rv').forEach((r,i)=>an(r,[{transform:'translateY(10px)',filter:'blur(3px)',opacity:.6},{transform:'none',filter:'blur(0)',opacity:1}],{duration:SOFT.d,delay:80+i*90,easing:SOFT.e}));
  await wait(700)}

function reset(){joined=false;busy=false;cta.classList.remove('member');cta.setAttribute('aria-label','Join group');$('#enter').tabIndex=-1;
  for(const a of document.getAnimations())if(!(a instanceof CSSAnimation))a.cancel();
  document.querySelectorAll('.fx').forEach(e=>e.remove())}
async function appear(){reset();an($('#float'),[{transform:'translateY(24px) scale(.92)',opacity:0},{transform:'none',opacity:1}],{duration:SP.d,easing:SP.e,fill:'none'});
  an($('#veil'),[{opacity:0},{opacity:1}],{duration:400,fill:'none'})}
cta.addEventListener('click',e=>{if(e.target.id==='enter'){an($('#enter'),[{transform:'scale(1)'},{transform:'scale(.94)'},{transform:'scale(1)'}],{duration:260,fill:'none'});return}join()});
cta.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();join()}});

/* scripted demo with a touch indicator */
const touch=$('#touch');let demoing=false;
async function tap(x,y,fn){Object.assign(touch.style,{left:x+'px',top:y+'px'});
  await an(touch,[{opacity:0,transform:'scale(1.4)'},{opacity:1,transform:'scale(1)'}],{duration:260,easing:OUT}).finished;
  an(touch,[{transform:'scale(1)'},{transform:'scale(.82)'}],{duration:120,easing:OUT});fn&&fn();await wait(160);
  an(touch,[{opacity:1,transform:'scale(.82)'},{opacity:0,transform:'scale(1.3)'}],{duration:300,easing:OUT})}
async function demo(){if(demoing)return;demoing=true;await appear();await wait(1500);
  await tap(80,352,join);await wait(2600);
  await tap(318,353,()=>an($('#enter'),[{transform:'scale(1)'},{transform:'scale(.94)'},{transform:'scale(1)'}],{duration:260,fill:'none'}));await wait(1400);
  demoing=false;window.__demoDone=true}
$('#play').onclick=demo;$('#reset').onclick=()=>{if(!demoing)appear()};$('#hide').onclick=()=>{document.body.classList.toggle('clean');fit()};
addEventListener('keydown',e=>{if(e.key.toLowerCase()==='h'){document.body.classList.toggle('clean');fit()}});
window.demo=demo;document.fonts.ready.then(fit);fit();
</script>
