<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Pixie Logo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: one hero stage for the animated mark, then lockups, sizes, app icons and colours on a guide-lined canvas */
:root{--canvas:#ececee;--guide:#dcdce0;--card:#fff;--ink:#121214;--muted:#74747e;--line:#e6e6ea;--pink:#FF4FA3;--pink-2:#FF8CC6;--pink-3:#F0237E;--pink-soft:#FFE6F2;
  --sans:"Geist",system-ui,-apple-system,sans-serif;--mono:"Geist Mono",ui-monospace,Menlo,monospace;--sh:0 0 0 1px rgba(18,18,20,.05),0 30px 60px -30px rgba(18,18,20,.25)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--canvas:#0b0b0d;--guide:#1a1a1e;--card:#151518;--ink:#f3f3f5;--muted:#8e8e98;--line:#25252b;--pink-soft:#3a1426;--sh:0 0 0 1px rgba(255,255,255,.06),0 30px 60px -30px rgba(0,0,0,.8);color-scheme:dark}}
:root[data-theme="dark"]{--canvas:#0b0b0d;--guide:#1a1a1e;--card:#151518;--ink:#f3f3f5;--muted:#8e8e98;--line:#25252b;--pink-soft:#3a1426;--sh:0 0 0 1px rgba(255,255,255,.06),0 30px 60px -30px rgba(0,0,0,.8);color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--canvas);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 48px}
h1,h2,p{margin:0}
.guides{position:fixed;inset:0;pointer-events:none;display:flex;justify-content:center}
.guides div{width:min(1120px,calc(100% - 32px));border-left:1px solid var(--guide);border-right:1px solid var(--guide);background:linear-gradient(var(--guide),var(--guide)) 50% 0/1px 100% no-repeat}
.wrap{position:relative;max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.card{background:var(--card);border-radius:24px;box-shadow:var(--sh);min-width:0}
.hero{position:relative;padding:28px;display:grid;grid-template-rows:auto 1fr auto;min-height:540px;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 52%,color-mix(in srgb,var(--pink) 16%,transparent),transparent 45%);pointer-events:none}
.top{display:flex;justify-content:space-between;align-items:center;font:500 11.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);position:relative}
.stage{display:grid;place-items:center;position:relative}
.big{width:min(260px,60vw);aspect-ratio:1;cursor:pointer}
.word{display:flex;flex-direction:column;align-items:center;gap:8px;position:relative}
.word h1{font:800 clamp(56px,9vw,96px)/1 var(--sans);letter-spacing:-.06em}
.word h1 span{color:var(--pink)}
.word p{color:var(--muted);font-size:16px}
.replay{position:absolute;right:0;bottom:0;font:500 13px/1 var(--sans);border:0;border-radius:99px;padding:10px 14px;background:var(--ink);color:var(--card);cursor:pointer;transition:transform .16s cubic-bezier(.23,1,.32,1)}
.replay:active{transform:scale(.96)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:760px){.grid{grid-template-columns:minmax(0,1fr)}.hero{min-height:460px;padding:20px}}
.sec{padding:24px;display:flex;flex-direction:column;gap:18px}
.lab{font:500 11.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.lock{display:flex;align-items:center;gap:12px;border-radius:16px;padding:22px;justify-content:center}
.lock .m{width:52px;height:52px}
.lock b{font:800 40px/1 var(--sans);letter-spacing:-.06em}
.lock.l{background:#fff;color:#121214;box-shadow:inset 0 0 0 1px #ececf0}.lock.d{background:#111113;color:#fff}.lock.p{background:var(--pink);color:#fff}
.locks{display:flex;flex-direction:column;gap:10px}
.sizes{display:flex;align-items:flex-end;gap:22px;flex-wrap:wrap}
.sizes div{display:flex;flex-direction:column;align-items:center;gap:8px;font:500 11px/1 var(--mono);color:var(--muted)}
.icons{display:flex;gap:16px;flex-wrap:wrap}
.ai{width:96px;height:96px;border-radius:24px;display:grid;place-items:center;box-shadow:0 10px 24px -12px rgba(0,0,0,.35)}
.ai .m{width:64px;height:64px}
.ai.w{background:linear-gradient(#fff,#f3f3f6);box-shadow:inset 0 0 0 1px #e8e8ee,0 10px 24px -12px rgba(0,0,0,.25)}
.ai.k{background:linear-gradient(#26262b,#0f0f11)}
.ai.s{background:linear-gradient(140deg,#FFE6F2,#FFC2E0)}
.sw{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.sw button{border:0;border-radius:14px;height:110px;padding:10px;display:flex;flex-direction:column;justify-content:flex-end;text-align:left;font:500 11px/1.35 var(--mono);cursor:pointer}
.sw b{font:600 12.5px/1.2 var(--sans);display:block}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,10px);opacity:0;background:#1c1c1f;color:#fff;font:500 13px/1 var(--sans);padding:12px 16px;border-radius:99px;transition:.25s cubic-bezier(.23,1,.32,1);pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>

</head>
<body>
<div class="guides" aria-hidden="true"><div></div></div>
<div class="wrap">
  <section class="card hero">
    <div class="top"><span>Pixie · Logo</span><span>Animated mark · v1</span></div>
    <div class="stage"><div class="big" id="big" title="Click to replay"></div></div>
    <div class="word"><h1>pixie<span>.</span></h1><p>Your brand, generated. Straight into Figma.</p><button class="replay" id="replay">Replay</button></div>
  </section>
  <div class="grid">
    <section class="card sec"><span class="lab">Lockups</span>
      <div class="locks"><div class="lock l"><span class="m"></span><b>pixie</b></div><div class="lock d"><span class="m"></span><b>pixie</b></div><div class="lock p"><span class="m mw"></span><b>pixie</b></div></div></section>
    <section class="card sec"><span class="lab">App icons</span>
      <div class="icons"><div class="ai w"><span class="m"></span></div><div class="ai k"><span class="m"></span></div><div class="ai s"><span class="m"></span></div></div>
      <span class="lab">Sizes</span>
      <div class="sizes"><div><span class="m" style="width:72px;height:72px"></span>72</div><div><span class="m" style="width:48px;height:48px"></span>48</div><div><span class="m" style="width:32px;height:32px"></span>32</div><div><span class="m" style="width:20px;height:20px"></span>20</div></div>
      <span class="lab">Colours · tap to copy</span>
      <div class="sw"><button data-c="#FF4FA3" style="background:#FF4FA3;color:#fff"><b>Pixie Pink</b>#FF4FA3</button><button data-c="#FF8CC6" style="background:#FF8CC6;color:#3d0a22"><b>Glow</b>#FF8CC6</button><button data-c="#F0237E" style="background:#F0237E;color:#fff"><b>Deep</b>#F0237E</button><button data-c="#121214" style="background:#121214;color:#fff"><b>Ink</b>#121214</button></div>
    </section>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
/* Pixie mark: a pink pixel that blinks, bursts into a sparkle and bounces back */
function PixieMark(host,opt={}){
  const W=opt.tone==='white',G=W?['#FFFFFF','#FFF4FA','#FFE1EF']:['#FF8CC6','#FF4FA3','#F0237E'],EY=W?'#F0237E':'#fff';const N=56,uid='px'+Math.random().toString(36).slice(2,7),R=46;
  host.innerHTML=`<svg viewBox="-64 -64 128 128" width="100%" height="100%" aria-hidden="true" style="overflow:visible;display:block">
    <defs><linearGradient id="${uid}g" x1="0" y1="-1" x2="0.4" y2="1"><stop offset="0" stop-color="${G[0]}"/><stop offset=".55" stop-color="${G[1]}"/><stop offset="1" stop-color="${G[2]}"/></linearGradient>
    <radialGradient id="${uid}h" cx=".35" cy=".25" r=".6"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs>
    <g class="dust"></g>
    <g class="bd"><path class="body" fill="url(#${uid}g)"/><path class="hl" fill="url(#${uid}h)"/>
      <g class="eyes"><g class="open"><rect x="-17" y="-9" width="9" height="9" rx="2.6" fill="${EY}"/><rect x="8" y="-9" width="9" height="9" rx="2.6" fill="${EY}"/></g>
      <g class="happy" opacity="0"><path d="M-18 -2 Q-12.5 -11 -7 -2" fill="none" stroke="${EY}" stroke-width="4.2" stroke-linecap="round"/><path d="M7 -2 Q12.5 -11 18 -2" fill="none" stroke="${EY}" stroke-width="4.2" stroke-linecap="round"/></g>
      <ellipse class="cheek" cx="-20" cy="7" rx="4.5" ry="2.6" fill="${EY}" opacity=".28"/><ellipse class="cheek" cx="20" cy="7" rx="4.5" ry="2.6" fill="${EY}" opacity=".28"/></g></g></svg>`;
  const svg=host.firstElementChild,body=svg.querySelector('.body'),hl=svg.querySelector('.hl'),bd=svg.querySelector('.bd'),open=svg.querySelector('.open'),happy=svg.querySelector('.happy'),eyes=svg.querySelector('.eyes'),dust=svg.querySelector('.dust');
  const sq=th=>{const c=Math.abs(Math.cos(th)),s=Math.abs(Math.sin(th));return 1/Math.pow(Math.pow(c,4.2)+Math.pow(s,4.2),1/4.2)*0.86};
  const st=th=>0.42+0.66*Math.pow(Math.abs(Math.cos(2*th)),2.6);
  function path(t,scale){const p=[];for(let i=0;i<N;i++){const th=i/N*Math.PI*2-Math.PI/2,r=(sq(th)*(1-t)+st(th)*t)*R*scale;p.push([Math.cos(th)*r,Math.sin(th)*r])}
    let d=`M${p[0][0].toFixed(2)},${p[0][1].toFixed(2)}`;for(let i=0;i<N;i++){const a=p[(i-1+N)%N],b=p[i],c=p[(i+1)%N],e=p[(i+2)%N];
      d+=`C${(b[0]+(c[0]-a[0])/6).toFixed(2)},${(b[1]+(c[1]-a[1])/6).toFixed(2)} ${(c[0]-(e[0]-b[0])/6).toFixed(2)},${(c[1]-(e[1]-b[1])/6).toFixed(2)} ${c[0].toFixed(2)},${c[1].toFixed(2)}`}return d+'Z'}
  const ease=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,clamp=x=>Math.max(0,Math.min(1,x)),seg=(t,a,b)=>clamp((t-a)/(b-a));
  const spring=x=>1-Math.exp(-6*x)*Math.cos(9*x);
  const dots=[...Array(8)].map((_,i)=>{const an=i/8*Math.PI*2+0.3,el=document.createElementNS('http://www.w3.org/2000/svg','path');el.setAttribute('fill',W?'#FFFFFF':(i%2?'#FF8CC6':'#FFC2E0'));dust.appendChild(el);return{an,el,s:i%2?4:5.5}});
  const star=s=>`M0,${-s}Q${s*.18},${-s*.18} ${s},0Q${s*.18},${s*.18} 0,${s}Q${-s*.18},${s*.18} ${-s},0Q${-s*.18},${-s*.18} 0,${-s}Z`;
  const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  const LOOP=opt.loop||7.2;let t0=performance.now(),raf;
  function frame(now){const T=((now-t0)/1000)%LOOP;
    const m=ease(seg(T,2.6,3.3))-ease(seg(T,4.7,5.3));const morph=clamp(m);
    const back=seg(T,5.3,6.4),bounce=back>0&&back<1?(1-spring(back))*0.16:0;
    const breathe=Math.sin(T/LOOP*Math.PI*6)*0.022*(1-morph);
    const spin=ease(seg(T,2.6,4.6))*90;
    const sx=1+breathe+bounce,sy=1-breathe*0.6-bounce;
    body.setAttribute('d',path(morph,1));hl.setAttribute('d',path(morph,.92));
    bd.setAttribute('transform',`rotate(${spin*morph}) scale(${sx.toFixed(3)} ${sy.toFixed(3)})`);
    const blink=(T>1.6&&T<1.75)||(T>6.6&&T<6.75)?0.12:1;open.setAttribute('transform',`translate(0 -4.5) scale(1 ${blink}) translate(0 4.5)`);
    open.setAttribute('opacity',(1-morph).toFixed(2));happy.setAttribute('opacity',morph.toFixed(2));eyes.setAttribute('transform',`rotate(${-spin*morph})`);
    const dp=seg(T,3.1,4.9);dots.forEach((d,i)=>{const r=40+ease(dp)*30+i%3*4,o=dp>0&&dp<1?Math.sin(dp*Math.PI):0,x=Math.cos(d.an)*r,y=Math.sin(d.an)*r;
      d.el.setAttribute('d',star(d.s*(0.4+0.6*o)));d.el.setAttribute('transform',`translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${dp*120})`);d.el.setAttribute('opacity',o.toFixed(2))});
    raf=requestAnimationFrame(frame)}
  if(reduce){body.setAttribute('d',path(0,1));hl.setAttribute('d',path(0,.92));dots.forEach(d=>d.el.setAttribute('opacity',0))}
  else{raf=requestAnimationFrame(frame);document.addEventListener('visibilitychange',()=>{if(document.hidden)cancelAnimationFrame(raf);else{raf=requestAnimationFrame(frame)}})}
  return{replay(){t0=performance.now()-2400}}
}

const big=PixieMark(document.getElementById('big'));
document.getElementById('replay').onclick=()=>big.replay();document.getElementById('big').onclick=()=>big.replay();
document.querySelectorAll('.m').forEach(el=>PixieMark(el,{tone:el.classList.contains('mw')?'white':'pink'}));
let tt;document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{const t=document.getElementById('toast');const done=()=>{t.textContent='Copied '+b.dataset.c;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),1400)};
  try{navigator.clipboard.writeText(b.dataset.c).then(done,done)}catch(e){done()}});
</script>

</body>
</html>
