/* Layout: one phone on a dark studio stage with a warm glow behind it; a floating control pill hides with H */
:root{
  color-scheme:dark;
  --stage:#0E0D10; --glow:rgba(233,190,120,.22); --glow2:rgba(70,90,255,.10);
  --ui:rgba(30,29,34,.82); --uifg:#EDEBF0; --uiline:rgba(255,255,255,.1);
  --font:"Inter Tight",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.32,.72,0,1); --out:cubic-bezier(.23,1,.32,1); --inout:cubic-bezier(.77,0,.175,1);
  --blue:#0B2CFF; --blue-ink:#0019B8; --link:#1433FF;
}
html,body{height:100%}
body{margin:0;background:radial-gradient(58% 46% at 50% 48%,var(--glow),transparent 72%),radial-gradient(60% 50% at 80% 100%,var(--glow2),transparent 70%),var(--stage);
  color:var(--uifg);font-family:var(--font);overflow:hidden;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;box-sizing:border-box;
  display:grid;place-items:center}
body.recmode{padding:0;width:1080px;height:1350px}
#pbox{position:relative}
.phone{position:absolute;left:0;top:0;width:410px;height:864px;border-radius:64px;transform-origin:0 0;
  background:linear-gradient(145deg,#F4F4F4,#DCDCDC);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.9),inset 0 0 0 2.5px #CFCFCF,0 60px 120px -20px rgba(0,0,0,.65),0 30px 60px -30px rgba(0,0,0,.5)}
.screen{position:absolute;inset:10px;border-radius:54px;overflow:hidden;background:#F7F7F8;color:#0F0F10;font-family:var(--font);
  -webkit-user-select:none;user-select:none;isolation:isolate;font-feature-settings:"ss01","cv11"}

.ctrl{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:6px;align-items:center;
  padding:6px;border-radius:999px;background:var(--ui);border:1px solid var(--uiline);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);z-index:10;max-width:calc(100vw - 32px);flex-wrap:wrap;justify-content:center}
.ctrl button,.ctrl select{font:500 13px var(--font);background:transparent;color:var(--uifg);border:0;border-radius:999px;padding:8px 13px;cursor:pointer;transition:background .15s,transform .16s var(--out)}
.ctrl button:hover,.ctrl select:hover{background:rgba(255,255,255,.08)}
.ctrl button:active{transform:scale(.96)}
.ctrl .play{background:#F2EEE6;color:#111;font-weight:600}
.ctrl .play:hover{background:#fff}
.ctrl select option{color:#111}
.ctrl :focus-visible{outline:2px solid #E9BE78;outline-offset:2px}
body.clean .ctrl,body.recmode .ctrl{display:none}

/* status bar */
.sb{position:absolute;inset:0 0 auto;height:54px;display:flex;align-items:center;justify-content:space-between;padding:4px 30px 0 48px;z-index:60;font-weight:600;font-size:16px;letter-spacing:-.01em;pointer-events:none}
.island{position:absolute;top:12px;left:50%;width:122px;height:35px;margin-left:-61px;border-radius:20px;background:#0A0A0A}
.sbi{display:flex;gap:6px;align-items:center}
.home{position:absolute;bottom:8px;left:50%;width:132px;height:5px;margin-left:-66px;border-radius:3px;background:#0F0F10;z-index:60;pointer-events:none}

/* ---------- billing ---------- */
#billing{position:absolute;inset:0;overflow-y:auto;padding:54px 0 40px;scrollbar-width:none;transform-origin:50% 30%;
  -webkit-mask-image:linear-gradient(#000 86%,transparent 98%);mask-image:linear-gradient(#000 86%,transparent 98%)}
#billing::-webkit-scrollbar{display:none}
.top{display:flex;justify-content:space-between;padding:16px 20px 0}
.ib{width:40px;height:40px;border-radius:13px;background:#EDEDEF;border:0;display:grid;place-items:center;cursor:pointer;color:#55555C;transition:transform .16s var(--out),background .15s}
.ib:active{transform:scale(.94)}
@media (hover:hover) and (pointer:fine){.ib:hover{background:#E5E5E8}}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
h1{font:700 28px/1.05 var(--font);letter-spacing:-.045em;margin:24px 20px 0;color:#0F0F10}
.slotbox{margin:20px 20px 0;background:#fff;border-radius:30px;box-shadow:0 1px 2px rgba(16,16,20,.04),0 8px 28px -12px rgba(16,16,20,.12)}
.slot{position:relative;height:164px;cursor:pointer;border-radius:30px;transition:transform .2s var(--out)}
.slot.pressing{transform:scale(.97)}
@media (hover:hover) and (pointer:fine){.slot:hover .pc{box-shadow:0 2px 4px rgba(16,16,20,.06),0 16px 32px -10px rgba(120,80,20,.28)}}
.lnk{display:block;width:100%;background:none;border:0;text-align:center;padding:14px 0 16px;color:var(--link);font:500 14px var(--font);letter-spacing:-.01em;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px;cursor:pointer;border-radius:0 0 30px 30px}
h2{font:600 19px var(--font);letter-spacing:-.04em;margin:36px 20px 6px;color:#0F0F10}
.tx{display:flex;justify-content:space-between;align-items:center;margin:0 20px;padding:14px 12px;border-bottom:1px solid #ECECEF;overflow:hidden}
.tx:last-child{border-bottom:0}
.tx>div{display:flex;flex-direction:column;gap:5px}
.tx .n{font-size:15px;color:#2C2C31;letter-spacing:-.025em;font-weight:500}.tx .d{font-size:12.5px;color:#9C9CA3;letter-spacing:-.01em}
.tx .r{align-items:flex-end}.tx .p{font-size:15px;color:var(--link);font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.tx .s{font-size:12px;font-weight:500;color:#16A34A}.tx .s.f{color:#E5372E}
.tx.new{animation:flash 1.8s var(--out)}
@keyframes flash{from{background:#FFF4DA}to{background:transparent}}

/* ---------- plan card ---------- */
.pc{position:absolute;box-sizing:border-box;border-radius:30px;border:4px solid #fff;overflow:hidden;
  box-shadow:0 1px 2px rgba(16,16,20,.05),0 12px 30px -10px rgba(16,16,20,.18);transition:box-shadow .25s}
.pc::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  background:radial-gradient(120% 55% at 0% 0%,rgba(255,255,255,.32),transparent 55%);box-shadow:inset 0 1px 0 rgba(255,255,255,.45)}
.pc.t-black::after{background:radial-gradient(120% 55% at 0% 0%,rgba(255,255,255,.08),transparent 55%);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.pc .shine{position:absolute;inset:-20%;pointer-events:none;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.5) 50%,transparent 60%);transform:translateX(-120%);z-index:2}
.slot .pc{inset:0;border-radius:30px}
.pc-t{position:absolute;left:20px;top:20px;font:600 19px/1.15 var(--font);letter-spacing:-.04em;white-space:nowrap}
.chip{position:absolute;right:16px;top:16px;font-size:11.5px;font-weight:500;letter-spacing:-.01em;padding:6px 11px;border-radius:99px;background:var(--chip);color:var(--chipt);
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.5),inset 0 1px 0 rgba(255,255,255,.35)}
.pc-p{position:absolute;left:20px;top:84px;font:600 27px/1.1 var(--font);letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.slot .pc-p{top:auto;bottom:18px}
.rec{position:absolute;right:16px;top:90px;font-size:10.5px;font-weight:500;color:#fff;background:linear-gradient(#4C4C50,#1B1B1E);padding:5px 11px;border-radius:99px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 2px 6px rgba(0,0,0,.18)}
.pc-d{position:absolute;left:20px;right:20px;top:132px;height:1px;background:var(--div)}
.pc-f{position:absolute;left:20px;right:14px;top:152px;list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px;font-size:12.4px;line-height:1.4;letter-spacing:-.02em}
.pc-f li{display:flex;gap:10px}.pc-f svg{flex:none;margin-top:3px;opacity:.8}
.slot .rec,.slot .pc-d,.slot .pc-f{display:none}
.flyer{z-index:30;pointer-events:none}
.flyer .pc-f,.flyer .pc-d,.flyer .rec{opacity:0}
.t-gold{background:linear-gradient(172deg,#FFF0CE 0%,#F6DFB0 40%,#E5C18C 100%);color:#17140F;--div:rgba(190,138,64,.3);--chip:rgba(232,200,132,.65);--chipt:#69532E}
.t-black{background:linear-gradient(165deg,#2E2E31 0%,#161618 55%,#060607 100%);color:#fff;--div:rgba(255,255,255,.12);--chip:rgba(255,255,255,.1);--chipt:#D9D9DC}
.t-silver{background:linear-gradient(165deg,#F1F1F2,#BEBEC1);color:#141416;--div:rgba(255,255,255,.75);--chip:rgba(255,255,255,.55);--chipt:#55555B}

const TOASTS={annual:'Annual plan secured. No turning back.',quarterly:'Quarterly plan secured. Three months in.',monthly:'Monthly plan secured. One month at a time.',weekly:'Weekly plan secured. Test drive started.',free:'Back on free. Upgrade anytime.'};
const TX0=[['Annual Plan','June 3 2025','$179.99',1],['Monthly Plan','May 3 2025','$24.99',1],['Monthly Plan','April 3 2025','$24.99',0],['Monthly Plan','March 3 2025','$24.99',1],['Monthly Plan','February 3 2025','$24.99',1],['Monthly Plan','January 3 2025','$24.99',1]];
const CHECK='<svg width="16" height="10" viewBox="0 0 17 11" aria-hidden="true"><path d="M1 5.8l3 3 5.6-6.6M7.4 8.6l.3.3 7.3-7.7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const h=html=>{const t=document.createElement('template');t.innerHTML=html.trim();return t.content.firstElementChild};
const idxOf=id=>PLANS.findIndex(p=>p.id===id);
const REC=location.hash.startsWith('#record');
if(REC)document.body.classList.add('recmode');
{const m=location.hash.match(/bg=(\w+)/);document.body.dataset.bg=m?m[1]:'paper'}

let current='annual',mode='billing',busy=false,S=1,billAnim=null;
const screen=$('#screen'),billing=$('#billing'),slot=$('#slot'),plans=$('#plans'),track=$('#track'),cta=$('#cta'),dots=$('#dots');

/* ---------- scaling ---------- */
function fit(){
  const W=REC?1080:innerWidth,H=REC?1350:innerHeight;
  const reserve=REC?150:(document.body.classList.contains('clean')?40:120);
  S=Math.min(REC?1.45:1.35,(H-reserve)/864,(W-40)/410);
  $('#pbox').style.width=410*S+'px';$('#pbox').style.height=864*S+'px';$('#phone').style.transform=`scale(${S})`;
}
addEventListener('resize',fit);
function loc(el){const r=el.getBoundingClientRect(),s=screen.getBoundingClientRect();return{x:(r.left-s.left)/S,y:(r.top-s.top)/S,w:r.width/S,h:r.height/S}}

/* ---------- rendering ---------- */
function cardHTML(p,{short=false,cls=''}={}){
  return `<div class="pc t-${p.theme} ${cls}" data-id="${p.id}"><span class="shine"></span><div class="pc-t">${short?p.short:p.name}</div>${p.id===current?'<span class="chip">Current Plan</span>':''}<div class="pc-p">${p.label}</div>${p.rec?'<span class="rec">Recommended</span>':''}<div class="pc-d"></div><ul class="pc-f">${p.f.map(t=>`<li>${CHECK}<span>${t}</span></li>`).join('')}</ul></div>`}
function renderBilling(){slot.innerHTML=cardHTML(PLANS[idxOf(current)],{short:true});$('#lnk').textContent=current==='free'?'Upgrade Plan':'See all subscriptions'}
function txRow([n,d,p,ok]){return h(`<div class="tx"><div><span class="n">${n}</span><span class="d">${d}</span></div><div class="r"><span class="p">${p}</span><span class="s ${ok?'':'f'}">${ok?'Successful':'Failed'}</span></div></div>`)}
function renderTx(){const t=$('#txs');t.innerHTML='';TX0.forEach(r=>t.append(txRow(r)))}
let cards=[];
function renderCarousel(){track.innerHTML=PLANS.map(p=>cardHTML(p,{cls:'car'})).join('');cards=[...track.children];dots.innerHTML=PLANS.map(()=>'<i></i>').join('')}
function shine(card){const s=card.querySelector('.shine');s&&s.animate([{transform:'translateX(-120%)'},{transform:'translateX(120%)'}],{duration:1100,easing:'cubic-bezier(.4,0,.2,1)'})}

/* ---------- carousel physics ---------- */
const W=298,G=14,MAX=PLANS.length-1;let pos=1,vel=0,target=1,raf=null,last=0,settle=[],shown=-1;
function layout(){
  cards.forEach((c,i)=>{const d=i-pos,ad=Math.min(1,Math.abs(d));
    c.style.transform=`translateX(${d*(W+G)}px) rotateY(${Math.max(-1,Math.min(1,d))*-7}deg) scale(${1-ad*.075})`;
    c.style.zIndex=10-Math.round(Math.abs(d));c.style.filter=ad>.02?`brightness(${1-ad*.06})`:''});
  const i=Math.max(0,Math.min(MAX,Math.round(pos)));if(i!==shown){shown=i;updateCTA(i);[...dots.children].forEach((d,k)=>d.classList.toggle('on',k===i))}}
function step(now){const dt=Math.min(.032,(now-last)/1000*TS);last=now;
  const a=210*(target-pos)-27*vel;vel+=a*dt;pos+=vel*dt;
  if(Math.abs(target-pos)<.0005&&Math.abs(vel)<.002){pos=target;vel=0;layout();raf=null;settle.splice(0).forEach(f=>f());return}
  layout();raf=requestAnimationFrame(step)}
function springTo(t){target=Math.max(0,Math.min(MAX,t));return new Promise(r=>{settle.push(r);if(!raf){last=performance.now();raf=requestAnimationFrame(step)}})}
const rubber=p=>p<0?p*.3:p>MAX?MAX+(p-MAX)*.3:p;

let drag=null;
track.addEventListener('pointerdown',e=>{if(busy||mode!=='plans'||drag)return;cancelAnimationFrame(raf);raf=null;track.classList.add('dragging');
  drag={id:e.pointerId,x:e.clientX,p:pos,lx:e.clientX,lt:performance.now(),v:0,moved:false,card:e.target.closest('.pc')};track.setPointerCapture(e.pointerId)});
track.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;const dx=(e.clientX-drag.x)/S;if(Math.abs(dx)>5)drag.moved=true;
  pos=rubber(drag.p-dx/(W+G));const now=performance.now(),dt=Math.max(8,now-drag.lt);
  const iv=-((e.clientX-drag.lx)/S/(W+G))/(dt/1000);drag.v=drag.v*.5+iv*.5;drag.lx=e.clientX;drag.lt=now;layout()});
const endDrag=e=>{if(!drag||e.pointerId!==drag.id)return;const d=drag;drag=null;track.classList.remove('dragging');
  if(!d.moved){if(d.card){const i=cards.indexOf(d.card);if(i!==Math.round(pos)){vel=0;springTo(i);return}}springTo(Math.round(pos));return}
  vel=Math.max(-14,Math.min(14,d.v));const proj=pos+vel*.14;springTo(Math.round(proj))};
track.addEventListener('pointerup',endDrag);track.addEventListener('pointercancel',endDrag);
addEventListener('keydown',e=>{
  if(e.key.toLowerCase()==='h'&&e.target.tagName!=='SELECT'){document.body.classList.toggle('clean');fit();return}
  if(mode!=='plans'||busy)return;
  if(e.key==='ArrowRight')springTo(Math.round(target)+1);if(e.key==='ArrowLeft')springTo(Math.round(target)-1);if(e.key==='Escape')closePlans()});

/* ---------- CTA label: blurred crossfade with a short lift ---------- */
let ctaPrev=null;
function setLabel(html,dir=1){const w=cta.querySelector('.clw'),old=w.querySelector('.cl:last-child');if(old.innerHTML===html)return;
  const n=h(`<span class="cl">${html}</span>`);w.append(n);
  old.animate([{transform:'none',opacity:1,filter:'blur(0)'},{transform:`translateY(${-9*dir}px)`,opacity:0,filter:'blur(3px)'}],{duration:200,easing:OUT,fill:'forwards'}).onfinish=()=>old.remove();
  n.animate([{transform:`translateY(${9*dir}px)`,opacity:0,filter:'blur(3px)'},{transform:'none',opacity:1,filter:'blur(0)'}],{duration:260,easing:OUT})}
function updateCTA(i){const p=PLANS[i];let t,dis=false;
  if(p.id===current){t='Current plan';dis=true}else if(p.id==='free')t='Continue with free plan';else t=`Subscribe at ${p.label}`;
  cta.disabled=dis;const dir=ctaPrev==null||i>=ctaPrev?1:-1;ctaPrev=i;setLabel(t,dir)}

/* ---------- shared-element flight ---------- */
function flyer(p,box,short){const f=h(cardHTML(p,{short,cls:'flyer'}));Object.assign(f.style,{left:box.x+'px',top:box.y+'px',width:box.w+'px',height:box.h+'px',borderRadius:box.r+'px'});screen.append(f);return f}
function fly(f,from,to,priceFrom,priceTo,titleTo,dur){
  const a=f.animate([{left:from.x+'px',top:from.y+'px',width:from.w+'px',height:from.h+'px',borderRadius:from.r+'px'},{left:to.x+'px',top:to.y+'px',width:to.w+'px',height:to.h+'px',borderRadius:to.r+'px'}],{duration:dur,easing:EASE,fill:'forwards'});
  const pr=f.querySelector('.pc-p');pr.style.bottom='auto';pr.animate([{top:priceFrom+'px'},{top:priceTo+'px'}],{duration:dur,easing:EASE,fill:'forwards'});
  const tt=f.querySelector('.pc-t');if(titleTo&&tt.textContent!==titleTo){tt.animate([{opacity:1,filter:'blur(0)'},{opacity:0,filter:'blur(2px)',offset:.4},{opacity:1,filter:'blur(0)'}],{duration:dur*.75});setTimeout(()=>tt.textContent=titleTo,dur*.3/TS)}
  return a.finished}
const priceTop=card=>card.querySelector('.pc-p').offsetTop;

async function openPlans(jumpTo){
  if(busy||mode!=='billing')return;busy=true;mode='plans';
  const p=PLANS[idxOf(current)],ci=idxOf(current);
  renderCarousel();pos=target=ci;vel=0;shown=-1;ctaPrev=null;layout();
  plans.classList.add('on');plans.style.background='transparent';
  const bc=slot.querySelector('.pc'),from={...loc(bc),r:30},tc=cards[ci],to={...loc(tc),r:30};
  const f=flyer(p,from,true);bc.style.visibility='hidden';tc.style.visibility='hidden';
  billAnim=billing.animate([{opacity:1,transform:'none',filter:'blur(0)'},{opacity:0,transform:'scale(.95)',filter:'blur(6px)'}],{duration:420,easing:OUT,fill:'forwards'});
  const bg=plans.animate([{background:'rgba(247,247,248,0)'},{background:'rgba(247,247,248,1)'}],{duration:380,easing:OUT,fill:'forwards'});
  cards.forEach(c=>{if(c===tc)return;const side=cards.indexOf(c)<ci?-1:1;
    c.animate([{opacity:0,translate:`${side*60}px 0`},{opacity:1,translate:'0 0'}],{duration:560,delay:200,easing:OUT,fill:'backwards'})});
  [[$('#close'),'0 -8px',240],[dots,'0 6px',300],[cta,'0 24px',260]].forEach(([el,t,d])=>el.animate([{opacity:0,translate:t,filter:'blur(4px)'},{opacity:1,translate:'0 0',filter:'blur(0)'}],{duration:480,delay:d,easing:OUT,fill:'backwards'}));
  await fly(f,from,to,priceTop(bc),84,p.name,560);
  tc.style.visibility='';f.remove();plans.style.background='';bg.cancel();
  tc.querySelectorAll('.pc-d,.rec').forEach(el=>el.animate([{opacity:0},{opacity:1}],{duration:260,easing:OUT}));
  tc.querySelectorAll('.pc-f li').forEach((li,i)=>li.animate([{opacity:0,transform:'translateY(6px)',filter:'blur(2px)'},{opacity:1,transform:'none',filter:'blur(0)'}],{duration:340,delay:i*45,easing:OUT,fill:'backwards'}));
  shine(tc);busy=false;
  if(jumpTo!=null&&jumpTo!==ci){await wait(280);springTo(jumpTo)}
}

async function closePlans(chosen){
  if(busy||mode!=='plans')return;busy=true;
  if(!chosen){const ci=idxOf(current);if(Math.abs(pos-ci)>.002)await springTo(ci)}
  const i=Math.round(pos),card=cards[i];
  if(chosen)current=chosen;
  const p=PLANS[idxOf(current)],from={...loc(card),r:30};
  billAnim&&billAnim.cancel();renderBilling();
  const bc=slot.querySelector('.pc');bc.style.visibility='hidden';const to={...loc(bc),r:30};
  const f=flyer(p,from,false);card.style.visibility='hidden';
  billing.animate([{opacity:0,transform:'scale(.95)',filter:'blur(6px)'},{opacity:1,transform:'none',filter:'blur(0)'}],{duration:460,delay:90,easing:OUT,fill:'backwards'});
  const fade=[...cards.filter(c=>c!==card),$('#close'),cta,dots];
  fade.forEach(c=>c.animate([{opacity:1},{opacity:0}],{duration:180,easing:OUT,fill:'forwards'}));
  plans.animate([{background:'rgba(247,247,248,1)'},{background:'rgba(247,247,248,0)'}],{duration:360,easing:OUT,fill:'forwards'});
  await fly(f,from,to,84,priceTop(bc),p.short,520);
  bc.style.visibility='';f.remove();plans.classList.remove('on');plans.getAnimations().forEach(a=>a.cancel());fade.forEach(c=>c.getAnimations().forEach(a=>a.cancel()));
  cta.classList.remove('ok');mode='billing';busy=false;
  if(chosen){
    if(p.id!=='free'){const d=new Date(),ds=`${d.toLocaleString('en-US',{month:'long'})} ${d.getDate()} ${d.getFullYear()}`;
      const row=txRow([p.name,ds,p.label,1]);row.classList.add('new');$('#txs').prepend(row);
      const hgt=row.offsetHeight;row.animate([{height:'0px',paddingTop:'0px',paddingBottom:'0px',opacity:0},{height:hgt+'px',paddingTop:'14px',paddingBottom:'14px',opacity:1}],{duration:460,easing:EASE})}
    bc.animate([{transform:'scale(1)'},{transform:'scale(1.02)'},{transform:'scale(1)'}],{duration:420,easing:OUT});shine(bc);
    showToast(p);
  }
}

/* ---------- subscribe ---------- */
async function subscribe(){if(busy||cta.disabled||mode!=='plans')return;const p=PLANS[Math.round(pos)];busy=true;
  cta.classList.add('loading');setLabel(`<span class="spin"></span>${p.id==='free'?'Switching plan':'Processing payment'}`);
  await wait(1250);cta.classList.remove('loading');cta.classList.add('ok');
  setLabel('<svg width="16" height="12" viewBox="0 0 13 10" aria-hidden="true"><path d="M1.5 5l3.5 3.5L11.5 1.5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>You\'re all set');
  await wait(620);busy=false;await closePlans(p.id)}
cta.onclick=subscribe;

let tt=null;
function showToast(p){const t=$('#toast');t.querySelector('.td').className='td t-'+p.theme;t.querySelector('.tx2').textContent=TOASTS[p.id];
  t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),3200/TS)}

/* ---------- entry points ---------- */
slot.addEventListener('pointerdown',()=>{if(mode==='billing'&&!busy)slot.classList.add('pressing')});
['pointerup','pointerleave','pointercancel'].forEach(ev=>slot.addEventListener(ev,()=>slot.classList.remove('pressing')));
slot.onclick=()=>openPlans();
slot.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openPlans()}};
$('#lnk').onclick=()=>openPlans(current==='free'?idxOf('annual'):undefined);
$('#close').onclick=()=>closePlans();

/* ---------- payment sheet ---------- */
let PMS,sel;
function renderPM(){const b=$('#pms');b.innerHTML='';
  PMS.forEach(([l,c,n,s],i)=>{const r=h(`<div class="pm ${i===sel?'on':''}" role="radio" tabindex="0" aria-checked="${i===sel}"><span class="logo" style="background:${c}">${l}</span><span class="m">${n}<small>${s}</small></span><span class="radio"></span></div>`);
    r.onclick=()=>{sel=i;renderPM()};b.append(r)})}
const sheet=on=>{$('#sheet').classList.toggle('on',on);$('#scrim').classList.toggle('on',on);if(on){$('#vlist').hidden=false;$('#vadd').hidden=true}};
$('#addcard').onclick=()=>{if(mode==='billing'&&!busy){renderPM();sheet(true)}};
$('#scrim').onclick=$('#sheetdone').onclick=()=>sheet(false);
/* add-card flow: list view <-> form with live card preview */
const DEMO_CARD={num:'5412 7534 1209 2291',exp:'11/29',cvc:'347',name:'Muhammedfuad A.'};
let form={num:'',exp:'',cvc:'',name:''};
function swapView(toAdd){const sh=$('#sheet'),from=toAdd?$('#vlist'):$('#vadd'),to=toAdd?$('#vadd'):$('#vlist');
  const h0=sh.offsetHeight;from.hidden=true;to.hidden=false;const h1=sh.offsetHeight;
  sh.animate([{height:h0+'px'},{height:h1+'px'}],{duration:440,easing:EASE});
  to.animate([{opacity:0,transform:`translateX(${toAdd?24:-24}px)`,filter:'blur(3px)'},{opacity:1,transform:'none',filter:'blur(0)'}],{duration:380,easing:OUT})}
function paintCard(){const n=form.num.replace(/\s/g,'');let out='';
  for(let i=0;i<16;i++){if(i&&i%4===0)out+=' ';out+=i<n.length?`<span>${n[i]}</span>`:'<span class="ph">•</span>'}
  $('#cnum').innerHTML=out;$('#cbrand').classList.toggle('on',n.length>=2);
  $('#cname').textContent=form.name?form.name.toUpperCase():'YOUR NAME';$('#cexp').textContent=form.exp||'MM/YY';
  const f=(id,v)=>$('#'+id+' span').textContent=v;f('fnum',form.num);f('fexp',form.exp);f('fcvc',form.cvc.replace(/./g,'•'));f('fname',form.name);
  const done=n.length===16&&form.exp.length===5&&form.cvc.length===3&&form.name.length>2;$('#savecard').disabled=!done}
function resetForm(){form={num:'',exp:'',cvc:'',name:''};document.querySelectorAll('.fld').forEach(x=>x.classList.remove('focus','ok'));
  const sv=$('#savecard');sv.classList.remove('ok');sv.querySelector('.sl').innerHTML='Save card';paintCard()}
function openAdd(){resetForm();swapView(true)}
async function typeInto(key,id,text,ms=55){const el=$('#'+id);document.querySelectorAll('.fld').forEach(x=>x.classList.remove('focus'));el.classList.add('focus');
  for(const ch of text){form[key]+=ch;paintCard();if(key==='num'&&ch!==' '){const last=[...$('#cnum').querySelectorAll('span:not(.ph)')].pop();last&&last.animate([{transform:'translateY(6px)',opacity:0},{transform:'none',opacity:1}],{duration:220,easing:OUT})}await wait(ms)}
  el.classList.remove('focus');el.classList.add('ok')}
function fillInstant(){Object.assign(form,DEMO_CARD);document.querySelectorAll('.fld').forEach(x=>x.classList.add('ok'));paintCard()}
async function saveCard(){const sv=$('#savecard');if(sv.disabled)return;sv.disabled=true;const sl=sv.querySelector('.sl');
  sl.innerHTML='<span class="spin"></span>Verifying card';await wait(1100);sv.classList.add('ok');
  sl.innerHTML='<svg width="15" height="11" viewBox="0 0 13 10" aria-hidden="true"><path d="M1.5 5l3.5 3.5L11.5 1.5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Card added';
  const cc=$('#ccard');cc.classList.remove('shine');void cc.offsetWidth;cc.classList.add('shine');await wait(700);
  const last4=form.num.replace(/\s/g,'').slice(-4);PMS.push(['MC','#EB5F1A',`Mastercard ending ${last4}`,`Expires ${form.exp}`]);sel=PMS.length-1;renderPM();swapView(false);
  const row=$('#pms').lastElementChild;row.classList.add('new');row.animate([{opacity:0,transform:'translateY(10px) scale(.97)'},{opacity:1,transform:'none'}],{duration:420,delay:120,easing:OUT,fill:'backwards'})}
$('#addnew').onclick=()=>{if(PMS.length>2)return;openAdd()};
$('#cardback').onclick=()=>swapView(false);
$('#savecard').onclick=saveCard;
document.querySelectorAll('.fld').forEach(f=>f.onclick=()=>{if(!demoing)fillInstant()});

/* ---------- scripted demo with an on-screen cursor ---------- */
const cur=$('#cur');let cx=300,cy=760,demoing=false;
const ease=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
function tween(dur,fn){return new Promise(r=>{const t0=performance.now();const f=now=>{const k=Math.min(1,(now-t0)*TS/dur);fn(ease(k));k<1?requestAnimationFrame(f):r()};requestAnimationFrame(f)})}
const place=()=>cur.style.transform=`translate(${cx}px,${cy}px)`;
function moveTo(x,y,dur=620){const x0=cx,y0=cy;return tween(dur,k=>{cx=x0+(x-x0)*k;cy=y0+(y-y0)*k;place()})}
const centre=el=>{const r=loc(el);return[r.x+r.w/2,r.y+r.h/2]};
async function tap(el,before){await moveTo(...centre(el));cur.classList.add('down');el.classList.add('pressing');await wait(150);cur.classList.remove('down');el.classList.remove('pressing');before&&before()}
async function swipe(dx,dur=520){cancelAnimationFrame(raf);raf=null;cur.classList.add('down');await wait(90);
  const p0=pos,x0=cx;await tween(dur,k=>{const d=dx*k;cx=x0+d;place();pos=rubber(p0-d/(W+G));layout()});
  cur.classList.remove('down');vel=-(dx/(W+G))/(dur/1000)*.35;await springTo(Math.round(pos+vel*.14))}
async function demo(){if(demoing)return;demoing=true;reset();await wait(80);
  cx=300;cy=760;place();cur.classList.add('on');await wait(700);
  await tap(slot);openPlans();await wait(1250);
  await moveTo(285,420,420);await swipe(-230);await wait(380);
  await moveTo(285,420,300);await swipe(-230);await wait(420);
  await moveTo(285,420,300);await swipe(-230);await wait(420);
  await moveTo(105,420,420);await swipe(230,480);await wait(650);
  await tap(cta);const done=subscribe();await moveTo(330,600,700);await done;
  await wait(1900);
  await tap($('#addcard'));$('#addcard').click();await wait(900);
  await tap($('#addnew'));openAdd();await wait(650);
  await moveTo(...centre($('#fnum')),420);await typeInto('num','fnum',DEMO_CARD.num,58);await wait(150);
  await moveTo(...centre($('#fexp')),320);await typeInto('exp','fexp',DEMO_CARD.exp,80);
  await moveTo(...centre($('#fcvc')),300);await typeInto('cvc','fcvc',DEMO_CARD.cvc,90);
  await moveTo(...centre($('#fname')),320);await typeInto('name','fname',DEMO_CARD.name,45);await wait(250);
  await tap($('#savecard'));await saveCard();await wait(1300);
  await tap($('#sheetdone'));sheet(false);
  await wait(500);cur.classList.remove('on');await wait(1800);
  demoing=false;window.__demoDone=true}

/* ---------- controls ---------- */
function reset(){busy=false;mode='billing';cancelAnimationFrame(raf);raf=null;settle=[];drag=null;current=$('#start').value;
  billing.getAnimations().forEach(a=>a.cancel());billAnim=null;plans.classList.remove('on');screen.querySelectorAll('.flyer').forEach(f=>f.remove());
  cta.classList.remove('ok','loading');$('#toast').classList.remove('show');sheet(false);billing.scrollTop=0;cur.classList.remove('on','down');
  PMS=[['VISA','#1A1F71','Visa ending 4417','Expires 08/28'],['PAY','#111113','Apple Pay','Default device']];sel=0;renderBilling();renderTx()}
$('#reset').onclick=()=>{if(!demoing)reset()};$('#start').onchange=()=>{if(!demoing)reset()};
$('#play').onclick=demo;
$('#bgsel').onchange=e=>{document.body.dataset.bg=e.target.value};
$('#hide').onclick=()=>{document.body.classList.toggle('clean');fit()};
window.demo=demo;
fit();reset();
</script>
