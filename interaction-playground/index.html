<title>Interaction Playground</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: a gallery of square, playable stages; each tile = stage, name, how to play, X caption */
:root{
  --bg:#F5F3F6; --fg:#1E1522; --muted:#6C5F72; --line:#E2DAE6; --card:#FFFFFF; --accent:#9A5A00;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --spring:cubic-bezier(.3,1.4,.5,1); --out:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#120D15;--fg:#F2ECF4;--muted:#A495AA;--line:#2C2232;--card:#1B1420;--accent:#F4B23E;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#120D15;--fg:#F2ECF4;--muted:#A495AA;--line:#2C2232;--card:#1B1420;--accent:#F4B23E;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:40px 80px}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:40px}
header{display:flex;flex-direction:column;gap:12px;max-width:66ch}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
h1{font-family:var(--display);font-weight:800;font-size:clamp(34px,6vw,56px);line-height:1;letter-spacing:-.035em;margin:0;text-wrap:balance}
header p{margin:0;color:var(--muted);font-size:17px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:40px 28px}
.tile{display:flex;flex-direction:column;gap:12px;min-width:0}
.sw{position:relative;width:100%;aspect-ratio:1/1}
.stage{position:absolute;inset:0;border-radius:22px;overflow:hidden;container-type:inline-size;touch-action:none;-webkit-user-select:none;user-select:none}
.scr{position:absolute;inset:0;font-size:4cqw;font-family:var(--body);display:grid;place-items:center}
.stage.is-focus{position:fixed;inset:0;margin:auto;width:min(90vw,82vh);height:min(90vw,82vh);z-index:51;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.backdrop{position:fixed;inset:0;background:#0B070D;z-index:50}
.exit{position:fixed;z-index:52;top:calc(14px + env(safe-area-inset-top,0px));right:calc(14px + env(safe-area-inset-right,0px));background:#1E1522!important;color:#F2ECF4!important;border-color:#3A2B40!important}
.meta{display:flex;align-items:center;gap:8px}
.meta h2{font:700 19px/1.2 var(--display);letter-spacing:-.02em;margin:0;flex:1;min-width:0}
.btn{font:600 13px var(--body);border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;padding:6px 12px;cursor:pointer;transition:transform .12s,border-color .2s;white-space:nowrap}
.btn:hover{border-color:var(--muted)}.btn:active{transform:scale(.95)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.how{margin:0;color:var(--muted);font-size:14px}
.cap{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start}
.cap p{margin:0;flex:1;font-size:14px;white-space:pre-line;min-width:0}
.cap .btn{padding:4px 10px;font-size:12px}
.hint{position:absolute;bottom:5%;left:0;right:0;text-align:center;font-size:.72em;font-weight:600;letter-spacing:.02em;opacity:.55;pointer-events:none}

/* 1 calendar */
.s-cal{background:#DCE3C9}
.cal{position:relative;width:56%;aspect-ratio:4/4.6}
.rings{position:absolute;top:-.9em;left:0;right:0;display:flex;justify-content:space-around;z-index:5}
.rings i{width:.9em;height:2.1em;border-radius:.5em;background:linear-gradient(#9AA08C,#5E6352);box-shadow:0 .1em .2em rgba(0,0,0,.3)}
.pad{position:absolute;inset:0;border-radius:.6em;background:#E9E4D8;box-shadow:0 .25em 0 #D6D0C2,0 .5em 0 #C9C2B2,0 1.4em 2.2em rgba(40,50,20,.28)}
.pg{position:absolute;inset:0;border-radius:.6em;background:#FFFDF8;display:flex;flex-direction:column;align-items:center;justify-content:center;transform-origin:4% 0;cursor:grab;border-top:.18em dashed #D9D2C2;touch-action:none;box-shadow:0 .1em .3em rgba(0,0,0,.08)}
.pg:active{cursor:grabbing}
.pg .mo{font:700 1.1em var(--display);letter-spacing:.2em;color:#E5484D}
.pg b{font:800 7em/1 var(--display);letter-spacing:-.05em;color:#23251E}
.pg .wd{font-size:1em;color:#77796C;font-weight:500}
.s-cal .hint{color:#3C4230}

/* 2 mood */
.s-mood{background:var(--mbg,#E4DDF5);transition:background .25s}
.mood{width:72%;display:flex;flex-direction:column;align-items:center;gap:1.1em}
.face{width:58%;overflow:visible}
.face .fc{fill:var(--mfc,#F5D36A);transition:fill .2s}
.face .eyes ellipse{fill:#2A1E12}
.face .brow,.face .mouth{fill:none;stroke:#2A1E12;stroke-width:4.5;stroke-linecap:round}
.mword{font:800 2.4em var(--display);letter-spacing:-.03em;color:#2A1E12;height:1.15em}
.roll{position:relative;display:inline-block;height:1.15em;line-height:1.15em;overflow:hidden;vertical-align:bottom}
.roll span{display:block;white-space:nowrap}
.mrange{-webkit-appearance:none;appearance:none;width:100%;height:1.1em;border-radius:99em;background:rgba(42,30,18,.14);outline:none;cursor:pointer}
.mrange::-webkit-slider-thumb{-webkit-appearance:none;width:2.2em;height:2.2em;border-radius:50%;background:#fff;border:.25em solid #2A1E12;box-shadow:0 .3em .8em rgba(0,0,0,.2);transition:transform .15s}
.mrange:active::-webkit-slider-thumb{transform:scale(1.15)}
.mrange::-moz-range-thumb{width:1.7em;height:1.7em;border-radius:50%;background:#fff;border:.25em solid #2A1E12}
.mrange:focus-visible{outline:2px solid #2A1E12;outline-offset:4px}

/* 3 day / night */
.s-sky{background:#8FD3FF}
.sky-d,.sky-n{position:absolute;inset:0;transition:opacity .7s}
.sky-d{background:linear-gradient(#7CC8FF,#D9F1FF)}
.sky-n{background:linear-gradient(#0B1030,#2B2357);opacity:0}
.night .sky-n{opacity:1}
.star{position:absolute;width:.32em;height:.32em;border-radius:50%;background:#fff;opacity:0;transform:scale(0);transition:opacity .4s,transform .4s var(--spring)}
.night .star{opacity:.9;transform:scale(1)}
.cloud{position:absolute;width:7em;height:2.2em;border-radius:99em;background:#fff;opacity:.85;transition:transform .8s var(--out),opacity .5s}
.cloud::before{content:"";position:absolute;width:3.2em;height:3.2em;border-radius:50%;background:inherit;left:1.4em;top:-1.5em}
.night .cloud{transform:translateY(3em);opacity:0}
.tg{position:relative;width:9.4em;height:4.2em;border-radius:99em;background:rgba(255,255,255,.55);box-shadow:inset 0 .2em .5em rgba(0,0,0,.15);cursor:pointer;transition:background .5s}
.night .tg{background:rgba(255,255,255,.12)}
.tg:focus-visible{outline:.15em solid #fff;outline-offset:.2em}
.knob{position:absolute;top:.4em;left:.4em;width:3.4em;height:3.4em;border-radius:99em;background:#FFC93C;box-shadow:0 0 1.4em rgba(255,201,60,.8);transition:background .4s,box-shadow .4s}
.night .knob{left:5.6em;background:radial-gradient(circle at 30% 35%,#C9C6D6 0 .35em,transparent .4em),radial-gradient(circle at 65% 65%,#C9C6D6 0 .5em,transparent .55em),#ECEAF4;box-shadow:0 0 1.4em rgba(220,220,255,.45)}
.tlabel{position:absolute;bottom:22%;left:0;right:0;text-align:center;font:800 2em var(--display);letter-spacing:-.03em;color:#0E3A5C;transition:color .5s}
.night .tlabel{color:#E9E6FF}
.tgwrap{position:relative;display:grid;place-items:center;width:100%;height:100%}

/* 4 like */
.s-like{background:#FFE7E0}
.likebox{display:flex;flex-direction:column;align-items:center;gap:1em}
.like{position:relative;width:8em;height:8em;border-radius:50%;border:0;background:#fff;box-shadow:0 1em 2.4em rgba(180,60,40,.18);display:grid;place-items:center;cursor:pointer;font:inherit}
.like:focus-visible{outline:.15em solid #E5484D;outline-offset:.3em}
.like svg{width:52%;height:52%;overflow:visible}
.like path{fill:none;stroke:#9B8F8C;stroke-width:1.8;transition:fill .2s,stroke .2s}
.like.on path{fill:#F2385A;stroke:#F2385A}
.ring{position:absolute;inset:0;border-radius:50%;border:.3em solid #F2385A;opacity:0;pointer-events:none}
.pt{position:absolute;left:50%;top:50%;width:.8em;height:.8em;margin:-.4em;border-radius:50%;pointer-events:none}
.lcount{font:700 1.5em var(--display);color:#5A2A22;font-variant-numeric:tabular-nums;display:flex;gap:.3em;align-items:baseline}
.lcount .roll{height:1.2em;line-height:1.2em}

/* 5 magnetic */
.s-mag{background:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px) 0 0/8% 8%,linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px) 0 0/8% 8%,#121014}
.magw{position:relative}
.mag{position:relative;overflow:hidden;border:0;border-radius:99em;padding:1.3em 2.4em;font:700 1.35em var(--display);letter-spacing:-.02em;color:#121014;background:#F4F1EA;cursor:pointer;transition:transform .5s var(--spring),background .3s}
.mag.near{transition:transform .12s linear}
.mag .mt{position:relative;display:inline-block;transition:transform .5s var(--spring);z-index:1}
.mag.near .mt{transition:transform .12s linear}
.mag .mglow{position:absolute;width:7em;height:7em;border-radius:50%;left:var(--gx,50%);top:var(--gy,50%);transform:translate(-50%,-50%) scale(0);background:radial-gradient(circle,#FFB86B 0,#FF6BB5 45%,transparent 70%);transition:transform .35s var(--out);pointer-events:none}
.mag.near .mglow{transform:translate(-50%,-50%) scale(1)}
.mag.done{background:#6FD3A0}
.mag:focus-visible{outline:.12em solid #F4F1EA;outline-offset:.3em}
.s-mag .hint{color:#F4F1EA}

/* 6 orb */
.s-orb{background:#0A0912}
.s-orb canvas{position:absolute;inset:0;width:100%;height:100%;cursor:pointer}
.orbl{position:absolute;bottom:12%;left:0;right:0;text-align:center;font:700 1.3em var(--display);color:#EDE9FF;letter-spacing:-.01em;pointer-events:none;transition:opacity .2s}

/* 7 radial */
.s-rad{background:#E9EEF7}
.card{position:relative;width:42%;aspect-ratio:3/4;border-radius:1.4em;cursor:pointer;touch-action:none;
  background:radial-gradient(circle at 30% 30%,#FFD36B,transparent 45%),radial-gradient(circle at 75% 70%,#FF6BB5,transparent 50%),linear-gradient(160deg,#5B6CFF,#21184A);box-shadow:0 1.2em 2.4em rgba(30,40,90,.25);transition:transform .3s var(--spring),filter .3s;z-index:2}
.card.held{transform:scale(.93)}
.s-rad.open .card{filter:brightness(.85)}
.dim{position:absolute;inset:0;background:rgba(20,24,40,.35);opacity:0;transition:opacity .3s;pointer-events:none;z-index:1}
.s-rad.open .dim{opacity:1}
.act{position:absolute;left:50%;top:50%;width:3.6em;height:3.6em;margin:-1.8em;border-radius:50%;background:#fff;color:#1E2340;display:grid;place-items:center;z-index:3;transform:translate(0,0) scale(0);transition:transform .45s var(--spring),background .15s,color .15s;box-shadow:0 .5em 1.2em rgba(0,0,0,.2);pointer-events:none}
.act svg{width:45%;height:45%;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.act.hot{background:#1E2340;color:#fff}
.act .al{position:absolute;bottom:115%;white-space:nowrap;font-size:.7em;font-weight:700;background:#1E2340;color:#fff;padding:.2em .6em;border-radius:99em;opacity:0;transform:translateY(.3em);transition:.2s}
.act.hot .al{opacity:1;transform:none}
.rtoast{position:absolute;bottom:8%;left:50%;transform:translate(-50%,200%);background:#1E2340;color:#fff;padding:.55em 1em;border-radius:99em;font-weight:700;font-size:.85em;z-index:4;transition:transform .45s var(--spring);white-space:nowrap}
.rtoast.show{transform:translate(-50%,0)}
.s-rad .hint{color:#1E2340;z-index:0}

/* 8 island */
.s-isl{background:radial-gradient(80% 60% at 20% 100%,#FF8A5C,transparent 60%),radial-gradient(70% 60% at 100% 30%,#7C5CFF,transparent 60%),#1B1530}
.isl{position:absolute;top:7%;left:50%;transform:translateX(-50%);width:32%;height:9%;border-radius:2em;background:#000;cursor:pointer;overflow:hidden;
  transition:width .6s var(--spring),height .6s var(--spring),border-radius .6s var(--spring);color:#fff;box-shadow:0 .4em 1.2em rgba(0,0,0,.35)}
.isl[data-s="timer"]{width:60%}
.isl[data-s="music"]{width:86%;height:34%;border-radius:2.4em}
.isl[data-s="call"]{width:86%;height:13%;border-radius:2.6em}
.st{position:absolute;inset:0;display:flex;align-items:center;padding:0 1em;gap:.7em;opacity:0;transform:scale(.9);transition:opacity .25s,transform .4s var(--spring);pointer-events:none}
.isl[data-s="timer"] .st-timer,.isl[data-s="music"] .st-music,.isl[data-s="call"] .st-call{opacity:1;transform:none;transition-delay:.15s}
.ringt{width:1.8em;height:1.8em;flex:none}
.ringt circle{fill:none;stroke-width:4}
.st-timer .tt{margin-left:auto;font:700 1.1em var(--mono);color:#FFB547;font-variant-numeric:tabular-nums}
.st-music{flex-direction:column;align-items:stretch;justify-content:center;padding:1.2em 1.3em;gap:.9em}
.mrow{display:flex;gap:.8em;align-items:center}
.art{width:3.6em;height:3.6em;border-radius:.8em;background:linear-gradient(135deg,#FFB547,#FF5C8A 55%,#7C5CFF);flex:none}
.mtx{display:flex;flex-direction:column;line-height:1.2;min-width:0;flex:1}
.mtx b{font-size:1em}.mtx span{font-size:.8em;opacity:.6}
.bars{display:flex;gap:.18em;align-items:center;height:1.6em}
.bars i{width:.22em;border-radius:99em;background:#FF8A5C;animation:bar .9s ease-in-out infinite}
.bars i:nth-child(2){animation-delay:-.3s}.bars i:nth-child(3){animation-delay:-.6s}.bars i:nth-child(4){animation-delay:-.15s}
@keyframes bar{0%,100%{height:30%}50%{height:100%}}
.prog{height:.3em;border-radius:99em;background:rgba(255,255,255,.18);overflow:hidden}
.prog i{display:block;height:100%;width:38%;background:#fff;border-radius:inherit}
.ctl{display:flex;justify-content:center;gap:2.2em;font-size:1.2em;opacity:.9}
.ctl svg{width:1.2em;height:1.2em;fill:#fff}
.st-call .cav{width:2.4em;height:2.4em;border-radius:50%;background:linear-gradient(135deg,#6FD3A0,#3E9BFF);flex:none}
.st-call .ctx{display:flex;flex-direction:column;line-height:1.2;flex:1}
.st-call .ctx span{font-size:.75em;opacity:.6}
.cb{width:2.3em;height:2.3em;border-radius:50%;display:grid;place-items:center;flex:none}
.cb svg{width:50%;height:50%;fill:#fff}
.cb.no{background:#FF4F4F}.cb.no svg{transform:rotate(135deg)}.cb.yes{background:#34C759}
.ihint{position:absolute;bottom:8%;left:0;right:0;text-align:center;color:#fff;opacity:.6;font-size:.75em;font-weight:600;pointer-events:none}
.clock{position:absolute;top:44%;left:0;right:0;text-align:center;color:#fff;font:800 4.4em/1 var(--display);letter-spacing:-.04em;opacity:.95;pointer-events:none;transition:opacity .4s}
.isl[data-s="music"]~.clock{opacity:.25}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>

<div class="wrap">
  <header>
    <span class="eyebrow">For X · play, record, post</span>
    <h1>Interaction Playground</h1>
    <p>Eight small, playful interactions in the spirit of Design Spells and 60fps. Every stage is live: open one in Focus, start recording in Cap, and play with it with your mouse. Mix these in between your Sello posts.</p>
  </header>
  <main class="grid" id="grid"></main>
</div>

<script>
const OUT='cubic-bezier(.2,.8,.2,1)';
const h=html=>{const t=document.createElement('template');t.innerHTML=html.trim();return t.content.firstElementChild};
function setRoll(el,val,dir=1){
  const old=el.firstElementChild;if(old.textContent===String(val))return;
  const n=document.createElement('span');n.textContent=val;n.style.cssText='position:absolute;inset:0';el.append(n);
  old.animate([{transform:'translateY(0)',opacity:1},{transform:`translateY(${-100*dir}%)`,opacity:0}],{duration:380,easing:OUT,fill:'forwards'});
  n.animate([{transform:`translateY(${100*dir}%)`,opacity:0},{transform:'none',opacity:1}],{duration:380,easing:OUT});
  setTimeout(()=>{old.remove();n.style.cssText=''},390);
}
const lerp=(a,b,t)=>a+(b-a)*t;
const ICON={
  share:'<path d="M12 3v12M7 8l5-5 5 5M5 14v6h14v-6"/>',
  save:'<path d="M12 20s-7-4.4-9.2-8.8C1.4 8.3 3 5 6.2 4.7c2-.2 3.5.9 5.8 3.2 2.3-2.3 3.8-3.4 5.8-3.2C21 5 22.6 8.3 21.2 11.2 19 15.6 12 20 12 20z"/>',
  copy:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
  edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',
  del:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>'
};

const DEMOS={
/* 1 ---------------------------------------------------------- */
cal:{cls:'s-cal',title:'Tear-off calendar',how:'Grab the page and drag it down. Pull far enough and it tears off. Let go early and it springs back.',
 x:'tear-off calendar where you actually get to tear it\n\ntomorrow\'s already waiting underneath',
 init(s){
  s.innerHTML='<div class="cal"><div class="rings"><i></i><i></i><i></i></div><div class="pad"></div></div><div class="hint">Drag the page down</div>';
  const pad=s.querySelector('.pad');let d=new Date();
  const nextOf=x=>{const n=new Date(x);n.setDate(n.getDate()+1);return n};
  const page=x=>h(`<div class="pg"><span class="mo">${x.toLocaleString('en',{month:'short'}).toUpperCase()}</span><b>${x.getDate()}</b><span class="wd">${x.toLocaleString('en',{weekday:'long'})}</span></div>`);
  let top=page(d),under=page(nextOf(d));pad.append(under,top);
  const bind=p=>{let y0=null,x0=0,dy=0;
    p.onpointerdown=e=>{y0=e.clientY;x0=e.clientX;p.setPointerCapture(e.pointerId);p.style.transition='none'};
    p.onpointermove=e=>{if(y0==null)return;dy=Math.max(0,e.clientY-y0);const H=pad.offsetHeight;
      const r=Math.min(dy/H*38,32);p.style.transform=`translateY(${dy*.22}px) rotate(${r}deg)`};
    p.onpointerup=p.onpointercancel=()=>{if(y0==null)return;y0=null;const H=pad.offsetHeight;
      if(dy>H*.38){
        const cur=getComputedStyle(p).transform;p.style.pointerEvents='none';
        p.animate([{transform:cur,opacity:1},{transform:'translate(25%,170%) rotate(62deg)',opacity:0}],{duration:750,easing:'cubic-bezier(.5,0,.75,0)',fill:'forwards'}).onfinish=()=>p.remove();
        d=nextOf(d);top=under;bind(top);under=page(nextOf(d));pad.prepend(under);
      }else{p.style.transition='transform .6s var(--spring)';p.style.transform=''}
      dy=0}};
  bind(top);
 }},
/* 2 ---------------------------------------------------------- */
mood:{cls:'s-mood',title:'Mood slider with a face',how:'Drag the slider. The face, the colour and the word all follow you.',
 x:'a mood slider that makes a face back at you',
 init(s,st){
  s.innerHTML=`<div class="mood"><svg class="face" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" class="fc"/><g class="eyes"><ellipse cx="35" cy="43" rx="5" ry="6"/><ellipse cx="65" cy="43" rx="5" ry="6"/></g><path class="brow l"/><path class="brow r"/><path class="mouth"/></svg><div class="mword"><span class="roll"><span>Okay</span></span></div><input type="range" min="0" max="100" value="50" class="mrange" aria-label="How are you feeling" id="mood-range"></div>`;
  const words=['Rough','Meh','Okay','Good','Great'];let last=2;
  const face=s.querySelector('.face'),mouth=s.querySelector('.mouth'),bl=s.querySelector('.brow.l'),br=s.querySelector('.brow.r'),eyes=[...s.querySelectorAll('.eyes ellipse')],roll=s.querySelector('.roll'),rng=s.querySelector('.mrange');
  const draw=()=>{const t=rng.value/100,k=lerp(-15,18,t);
    mouth.setAttribute('d',`M30 ${66-k*.2} Q50 ${66+k} 70 ${66-k*.2}`);
    const lift=(.5-t)*10;bl.setAttribute('d',`M26 ${30+lift*.2} L42 ${30-lift}`);br.setAttribute('d',`M58 ${30-lift} L74 ${30+lift*.2}`);
    const ry=t>.75?lerp(6,2.2,(t-.75)/.25):6;eyes.forEach(e=>e.setAttribute('ry',ry));
    st.style.setProperty('--mfc',`hsl(${lerp(215,46,t)} ${lerp(25,95,t)}% ${lerp(72,62,t)}%)`);
    st.style.setProperty('--mbg',`hsl(${lerp(225,40,t)} ${lerp(25,80,t)}% ${lerp(88,90,t)}%)`);
    const i=Math.min(4,Math.floor(t*5));if(i!==last){setRoll(roll,words[i],i>last?1:-1);last=i;
      face.animate([{transform:'scale(1)'},{transform:'scale(1.08)'},{transform:'scale(1)'}],{duration:320,easing:OUT})}};
  rng.oninput=draw;draw();
 }},

orb:{cls:'s-orb',title:'Voice orb',how:'Leave it alone and it breathes. Press and hold anywhere and it starts listening.',
 x:'voice orb. idle it breathes, hold it down and it listens',
 init(s,st,alive){
  s.innerHTML='<canvas></canvas><div class="orbl">Hold to talk</div>';
  const cv=s.querySelector('canvas'),ctx=cv.getContext('2d'),lab=s.querySelector('.orbl');
  let W=0,H=0,dpr=1,listen=false,amp=.035,lvl=0,lvlT=0,ringT=0,t=0,last=performance.now();
  const size=()=>{dpr=Math.min(2,devicePixelRatio||1);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr};size();
  const ro=new ResizeObserver(size);ro.observe(cv);
  const down=()=>{listen=true;lab.textContent='Listening…'};const up=()=>{listen=false;lab.textContent='Hold to talk'};
  cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);down()};cv.onpointerup=cv.onpointercancel=up;
  const iv=setInterval(()=>{lvlT=listen?Math.random():0},110);
  const layers=[['#7C5CFF','#3B2BB0',0],['#FF6BB5','#B0306E',2.1],['#36D1DC','#1F7FA0',4.2]];
  const blob=(cx,cy,R,a,ph)=>{const N=72,pts=[];for(let i=0;i<N;i++){const th=i/N*Math.PI*2;
      const r=R*(1+a*(Math.sin(3*th+t*1.3+ph)*.5+Math.sin(5*th-t*.9+ph*2)*.3+Math.sin(2*th+t*.7)*.2));pts.push([cx+Math.cos(th)*r,cy+Math.sin(th)*r])}
    ctx.beginPath();for(let i=0;i<N;i++){const p=pts[i],q=pts[(i+1)%N],mx=(p[0]+q[0])/2,my=(p[1]+q[1])/2;i?ctx.quadraticCurveTo(p[0],p[1],mx,my):ctx.moveTo(mx,my)}ctx.closePath()};
  const frame=now=>{if(!alive()){clearInterval(iv);ro.disconnect();return}
    const dt=Math.min(50,now-last)/1000;last=now;t+=dt*(listen?2.2:1);
    lvl+=(lvlT-lvl)*.18;amp+=((listen?.09+lvl*.12:.035)-amp)*.08;
    ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
    const cx=W/2,cy=H*.45,R=Math.min(W,H)*(.2+(listen?lvl*.03:Math.sin(t*1.2)*.008));
    if(listen){ringT=(ringT+dt*.8)%1;for(const o of [0,.5]){const k=(ringT+o)%1;ctx.beginPath();ctx.arc(cx,cy,R*(1.2+k*.9),0,Math.PI*2);ctx.strokeStyle=`rgba(200,190,255,${.35*(1-k)})`;ctx.lineWidth=2;ctx.stroke()}}
    ctx.save();ctx.filter=`blur(${Math.round(W*.03)}px)`;ctx.globalCompositeOperation='screen';
    layers.forEach(([c1,c2,ph],i)=>{const ox=Math.cos(t*.6+ph)*R*.18,oy=Math.sin(t*.5+ph)*R*.18;blob(cx+ox,cy+oy,R*(1-i*.08),amp*(1+i*.3),ph);
      const g=ctx.createRadialGradient(cx+ox-R*.3,cy+oy-R*.3,R*.1,cx+ox,cy+oy,R*1.2);g.addColorStop(0,c1);g.addColorStop(1,c2);ctx.fillStyle=g;ctx.fill()});
    ctx.restore();
    ctx.save();ctx.globalAlpha=.55;const hg=ctx.createRadialGradient(cx-R*.35,cy-R*.4,0,cx-R*.35,cy-R*.4,R*.7);hg.addColorStop(0,'rgba(255,255,255,.7)');hg.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=hg;ctx.beginPath();ctx.arc(cx,cy,R*.95,0,Math.PI*2);ctx.fill();ctx.restore();
    requestAnimationFrame(frame)};
  requestAnimationFrame(frame);
 }},

rad:{cls:'s-rad',title:'Hold for actions',how:'Press and hold the card. When the actions fan out, keep holding, slide onto one and let go.',
 x:'hold to reveal. the actions fan out from right where your finger already is',
 init(s){
  s.innerHTML='<div class="dim"></div><div class="card" role="button" aria-label="Photo, hold for actions"></div><div class="rtoast"></div><div class="hint">Hold the card, slide to an action</div>';
  const st=s.parentElement,card=s.querySelector('.card'),toast=s.querySelector('.rtoast');
  const items=[['share','Share'],['save','Save'],['copy','Copy link'],['edit','Edit'],['del','Delete']];
  const acts=items.map(([k,l])=>{const a=h(`<div class="act"><span class="al">${l}</span><svg viewBox="0 0 24 24">${ICON[k]}</svg></div>`);a.dataset.l=l;s.append(a);return a});
  let timer=null,open=false,hot=null,tt=null;st.classList.remove('open');
  const place=()=>{const sr=s.getBoundingClientRect(),cr=card.getBoundingClientRect(),cx=cr.left+cr.width/2-sr.left-sr.width/2,cy=cr.top-sr.top-sr.height/2+cr.height*.15,R=sr.width*.3;
    acts.forEach((a,i)=>{const ang=(-160+i*35)*Math.PI/180;a.dataset.x=cx+Math.cos(ang)*R;a.dataset.y=cy+Math.sin(ang)*R})};
  const show=()=>{open=true;st.classList.add('open');place();card.animate([{rotate:'0deg'},{rotate:'-2deg'},{rotate:'2deg'},{rotate:'0deg'}],{duration:240});
    acts.forEach((a,i)=>{a.style.transitionDelay=i*35+'ms';a.style.transform=`translate(${a.dataset.x}px,${a.dataset.y}px) scale(1)`})};
  const hide=()=>{open=false;st.classList.remove('open');card.classList.remove('held');acts.forEach(a=>{a.style.transitionDelay='0ms';a.style.transform='translate(0,0) scale(0)';a.classList.remove('hot')});hot=null};
  card.onpointerdown=e=>{card.setPointerCapture(e.pointerId);card.classList.add('held');timer=setTimeout(show,420)};
  card.onpointermove=e=>{if(!open)return;let best=null,bd=1e9;
    acts.forEach(a=>{const r=a.getBoundingClientRect(),d=Math.hypot(e.clientX-(r.left+r.width/2),e.clientY-(r.top+r.height/2));if(d<bd){bd=d;best=a}});
    const thr=s.getBoundingClientRect().width*.11;const nh=bd<thr?best:null;
    if(nh!==hot){hot&&hot.classList.remove('hot');hot=nh;if(hot){hot.classList.add('hot');hot.animate([{scale:1},{scale:1.18},{scale:1}],{duration:250})}}};
  card.onpointerup=card.onpointercancel=()=>{clearTimeout(timer);card.classList.remove('held');
    if(open){if(hot){const l=hot.dataset.l;toast.textContent=l==='Delete'?'Moved to bin':l==='Copy link'?'Link copied':l==='Save'?'Saved to favourites':l==='Edit'?'Opening editor':'Share sheet open';
      toast.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>toast.classList.remove('show'),1400)}hide()}};
 }},

isl:{cls:'s-isl',title:'One pill, four states',how:'Click the black pill at the top. It morphs from idle to a timer, then music, then an incoming call, and back.',
 x:'one pill, four states. timer, music, calls, all morphing out of the same shape',
 init(s,st,alive){
  s.innerHTML=`<div class="isl" data-s="idle" role="button" tabindex="0" aria-label="Status pill, click to change">
   <div class="st st-timer"><svg class="ringt" viewBox="0 0 36 36"><circle cx="18" cy="18" r="14" stroke="rgba(255,181,71,.25)"/><circle class="arc" cx="18" cy="18" r="14" stroke="#FFB547" stroke-dasharray="88" stroke-dashoffset="20" stroke-linecap="round" transform="rotate(-90 18 18)"/></svg><span class="tt">04:59</span></div>
   <div class="st st-music"><div class="mrow"><div class="art"></div><div class="mtx"><b>Late Night Lagos</b><span>Original mix</span></div><div class="bars"><i></i><i></i><i></i><i></i></div></div><div class="prog"><i></i></div><div class="ctl"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM9.5 12l8.5 6V6z"/></svg><svg viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></div></div>
   <div class="st st-call"><div class="cav"></div><div class="ctx"><b>Tolu</b><span>mobile</span></div><span class="cb no"><svg viewBox="0 0 24 24"><path d="M6.6 10.8a15 15 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg></span><span class="cb yes"><svg viewBox="0 0 24 24"><path d="M6.6 10.8a15 15 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg></span></div>
  </div><div class="clock"></div><div class="ihint">Tap the pill</div>`;
  const isl=s.querySelector('.isl'),tt=s.querySelector('.tt'),arc=s.querySelector('.arc'),clock=s.querySelector('.clock');
  const order=['idle','timer','music','call'];let i=0,sec=299;
  const tick=()=>{const n=new Date();clock.textContent=n.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})};tick();
  const iv=setInterval(()=>{if(!alive()){clearInterval(iv);return}tick();if(isl.dataset.s==='timer'){sec=Math.max(0,sec-1);tt.textContent=`0${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`;arc.setAttribute('stroke-dashoffset',88-88*sec/300)}},1000);
  const next=()=>{i=(i+1)%order.length;isl.dataset.s=order[i];if(order[i]==='call')isl.animate([{translate:'0 0'},{translate:'-.3em 0'},{translate:'.3em 0'},{translate:'0 0'}],{duration:280,delay:500,iterations:2})};
  isl.onclick=next;isl.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();next()}};
 }}
};

const ORDER=['cal','like','sky','mag','mood','orb','rad','isl'];
const grid=document.getElementById('grid');
let backdrop=null,exitBtn=null,focused=null;
function unfocus(){if(!focused)return;focused.classList.remove('is-focus');backdrop.remove();exitBtn.remove();focused=null}
function focusStage(st){unfocus();focused=st;backdrop=h('<div class="backdrop"></div>');exitBtn=h('<button class="btn exit" type="button">Exit focus (Esc)</button>');
  backdrop.onclick=unfocus;exitBtn.onclick=unfocus;document.body.append(backdrop,exitBtn);st.classList.add('is-focus')}
addEventListener('keydown',e=>{if(e.key==='Escape')unfocus()});
async function copy(btn,text,el){
  try{await navigator.clipboard.writeText(text);btn.textContent='Copied'}
  catch{const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);btn.textContent='Selected'}
  setTimeout(()=>btn.textContent='Copy',1600)}

ORDER.forEach(id=>{
  const d=DEMOS[id];
  const tile=h(`<section class="tile"><div class="sw"><div class="stage ${d.cls}"><div class="scr"></div></div></div>
    <div class="meta"><h2>${d.title}</h2><button class="btn rs" type="button">Reset</button><button class="btn fc" type="button">Focus</button></div>
    <p class="how"></p><div class="cap"><p></p><button class="btn" type="button">Copy</button></div></section>`);
  tile.querySelector('.how').textContent=d.how;
  const cp=tile.querySelector('.cap p');cp.textContent=d.x;
  tile.querySelector('.cap .btn').onclick=e=>copy(e.target,d.x,cp);
  grid.append(tile);
  const st=tile.querySelector('.stage'),scr=tile.querySelector('.scr');let gen=0;
  const start=()=>{const my=++gen;d.init(scr,st,()=>my===gen&&scr.isConnected)};
  tile.querySelector('.rs').onclick=start;
  tile.querySelector('.fc').onclick=()=>focusStage(st);
  start();
});
</script>
